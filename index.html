<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#121418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="グッズ在庫">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>コロッケ グッズ在庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&family=BIZ+UDPGothic:wght@400;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* 劇場の物販ブース：ジャンルは虹の7色、在庫はハンガーの札（販売レジ・管理画面と同じ） */
  :root {
    --theme: #14171d;
    --bg: #e9ecf0; --card: #fff; --text: #14171d; --muted: #5d6571; --line: #d0d5dc; --hatch: #c9ced6;
    --zero: #9aa2ad; --low: #d97a00; --low-soft: #fff1dc; --ok: #14171d; --bad: #d23a2f;
    --g-t: #e0352b; --g-towel: #ef7a14; --g-file: #d9a400; --g-knit: #23945a; --g-key: #1d74d0; --g-goods: #6a4fd0; --g-mag: #b0409a;
    --rainbow: linear-gradient(90deg, var(--g-t) 0 14.3%, var(--g-towel) 0 28.6%, var(--g-file) 0 42.9%, var(--g-knit) 0 57.2%, var(--g-key) 0 71.5%, var(--g-goods) 0 85.8%, var(--g-mag) 0);
    --display: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
    --num: "Barlow Condensed", "DIN Condensed", "Arial Narrow", sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    font-family: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
    background: var(--bg); color: var(--text); font-size: 15px;
    -webkit-text-size-adjust: 100%;
  }
  body.big { zoom: 1.18; }

  .top { position: sticky; top: 0; z-index: 10; background: var(--card); border-bottom: 1px solid var(--line); }
  .app-header { position: relative; display: flex; align-items: center; gap: 6px; padding: 10px 10px 12px 16px; background: var(--text); color: #fff; }
  .app-header::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--rainbow); }
  .brand { flex: 1; min-width: 0; }
  .brand h1 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 20px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand .sub { font-size: 11px; color: rgba(255,255,255,.65); margin-top: 1px; }
  .hbtn { flex: 0 0 auto; min-width: 36px; height: 36px; padding: 0 8px; border: 1px solid rgba(255,255,255,.35); border-radius: 18px;
    background: transparent; color: #fff; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
  .hbtn.on { background: #fff; color: var(--text); }
  .hbtn.spin { opacity: .5; }

  .updated-bar { display: flex; align-items: center; gap: 8px; padding: 5px 16px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .updated-bar .test { margin-left: auto; padding: 1px 8px; border-radius: 9px; background: var(--bad); color: #fff; font-weight: 700; }

  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tab { flex: 1; padding: 8px 4px 6px; border: 0; border-bottom: 3px solid transparent; background: none; color: var(--muted);
    font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  .tab small { display: block; font-family: var(--num); font-size: 24px; line-height: 1; font-weight: 700; color: inherit; order: -1; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .tab.active { color: var(--text); border-bottom-color: var(--text); }
  .pool-note { margin: 0; padding: 6px 16px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }

  .controls { padding: 10px 14px 10px; max-width: 760px; margin: 0 auto; }
  .search { position: relative; }
  .search input { width: 100%; padding: 10px 40px 10px 16px; border: 1.5px solid var(--text); border-radius: 999px; background: #fff; color: var(--text);
    font: inherit; font-size: 16px; -webkit-appearance: none; appearance: none; }
  .search input::-webkit-search-cancel-button { -webkit-appearance: none; }
  .search input:focus { outline: none; box-shadow: 0 0 0 3px rgba(20,23,29,.15); }
  .search .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border: 0; background: none; color: var(--muted); font-size: 16px; cursor: pointer; }
  .chips { display: flex; gap: 6px; margin: 10px -14px 0; padding: 0 14px 2px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; padding: 6px 13px; border: 1.5px solid var(--gc, var(--text)); border-radius: 999px;
    background: #fff; color: var(--text); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
  .chips button i { width: 10px; height: 10px; border-radius: 3px; background: var(--gc, var(--text)); }
  .chips button.on { background: var(--gc, var(--text)); color: #fff; }
  .chips button.on i { background: #fff; }
  .row2 { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .seg { display: flex; flex: 1; border: 1.5px solid var(--text); border-radius: 10px; overflow: hidden; }
  .seg button { flex: 1; padding: 8px 2px; border: 0; border-left: 1px solid var(--line); background: #fff; color: var(--muted); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  .seg button:first-child { border-left: 0; }
  .seg button.on { background: var(--text); color: #fff; }
  .toggle-zero { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .toggle-zero input { width: 20px; height: 20px; margin: 0; accent-color: var(--text); }

  main { max-width: 760px; margin: 0 auto; padding: 12px 14px 70px; }
  .summary { margin: 2px 2px 12px; font-size: 13px; color: var(--muted); }
  .summary b { color: var(--text); font-family: var(--num); font-size: 22px; margin-right: 1px; }

  /* 商品名ごとのまとまり：色の見出しタブ */
  .group-title { display: flex; justify-content: space-between; align-items: flex-end; margin: 22px 0 0; font-size: 15px; border-bottom: 3px solid var(--gc, var(--text)); }
  .group-title:first-child { margin-top: 4px; }
  .group-title b { background: var(--gc, var(--text)); color: #fff; padding: 4px 12px 3px; border-radius: 8px 8px 0 0; font-family: var(--display); font-weight: 900; }
  .group-title span { font-size: 13px; color: var(--muted); padding-bottom: 3px; }
  .group-title span .n { font-family: var(--num); font-size: 20px; color: var(--text); }

  .item { display: flex; align-items: flex-start; gap: 14px; width: 100%; padding: 14px 2px; border: 0; border-bottom: 1px solid var(--line);
    background: none; font: inherit; color: inherit; text-align: left; cursor: pointer; }
  #list > .item { background: var(--card); padding: 12px; border: 1.5px solid var(--text); border-radius: 10px; margin-bottom: 10px; }
  .thumb { flex: 0 0 76px; width: 76px; height: 76px; border-radius: 8px; background: #eef0f3; object-fit: cover; }
  .thumb.none { display: grid; place-items: center; padding: 4px; text-align: center; overflow: hidden;
    background: color-mix(in srgb, var(--gc, var(--text)) 13%, #fff); color: color-mix(in srgb, var(--gc, var(--text)) 82%, #000);
    font-family: var(--display); font-weight: 900; font-size: 12px; line-height: 1.15; word-break: keep-all; overflow-wrap: anywhere; }
  .info { flex: 1; min-width: 0; }
  .name { font-size: 17px; font-weight: 700; line-height: 1.3; }
  .new { display: inline-block; margin-left: 6px; padding: 1px 6px; vertical-align: 2px; border-radius: 4px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 700; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px 10px; margin: 3px 0 4px; }
  .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); }
  .tag i { width: 11px; height: 11px; border-radius: 50%; border: 1px solid var(--line); background: var(--cc, transparent); }

  /* サイズのハンガー札 */
  .sizes { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 58px)); gap: 13px 5px; padding-top: 9px; }
  .sz { position: relative; border: 1.5px solid var(--text); border-radius: 7px; padding: 3px 0 4px; text-align: center; background: #fff; }
  .sz::before { content: ""; position: absolute; left: 50%; top: -8px; width: 11px; height: 7px; border: 1.5px solid var(--text); border-bottom: none; border-radius: 7px 7px 0 0; transform: translateX(-50%); background: #fff; }
  .sz i { display: block; font-style: normal; font-size: 11px; font-weight: 700; color: var(--muted); line-height: 1.2; }
  .sz b { display: block; font-family: var(--num); font-weight: 700; font-size: 23px; line-height: 1; font-variant-numeric: tabular-nums; }
  .sz.wide { grid-column: 1 / -1; max-width: 180px; display: flex; align-items: baseline; justify-content: center; gap: 5px; padding: 6px 10px; }
  .sz.wide i { display: inline; font-size: 12px; }
  .sz.low { border-color: var(--low); background: var(--low-soft); }
  .sz.low::before { border-color: var(--low); background: var(--low-soft); }
  .sz.low b { color: var(--low); }
  .sz.zero { border-color: var(--hatch); background: repeating-linear-gradient(-45deg, transparent 0 4px, var(--hatch) 4px 5px); }
  .sz.zero::before { border-color: var(--hatch); background: #fff; }
  .sz.zero b, .sz.zero i { color: var(--zero); }
  .sz.zero b { text-decoration: line-through; text-decoration-thickness: 2px; }
  .state { font-size: 12px; font-weight: 700; color: var(--low); margin-top: 6px; display: block; }

  /* 写真で並べる（タイル表示）。売り切れは灰色 */
  .view-seg { margin-top: 8px; }
  body.tiles #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  body.tiles .group-title { grid-column: 1 / -1; }
  body.tiles .empty { grid-column: 1 / -1; }
  body.tiles .item { flex-direction: column; gap: 8px; margin: 0; padding: 0 0 10px; background: var(--card); border: 1.5px solid var(--text); border-radius: 10px; overflow: hidden; }
  body.tiles .thumb { flex: none; width: 100%; height: auto; aspect-ratio: 1 / 1; border-radius: 0; border-bottom: 1.5px solid var(--text); }
  body.tiles .thumb.none { font-size: 20px; padding: 10px; }
  body.tiles #list > .item { padding: 0 0 10px; }
  body.tiles .info { width: 100%; padding: 0 10px; }
  body.tiles .name { font-size: 15px; word-break: keep-all; overflow-wrap: anywhere; }
  body.tiles .sizes { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 4px; }
  body.tiles .sz b { font-size: 20px; }
  .item.soldout .thumb { filter: grayscale(1); opacity: .5; }
  .item.soldout .name { color: var(--muted); }
  .empty { padding: 36px 16px; text-align: center; color: var(--muted); line-height: 1.9; }
  .link { border: 0; background: none; color: var(--text); font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; }

  .modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(15,18,24,.6); }
  .modal-box { width: 100%; max-width: 440px; max-height: 92vh; overflow-y: auto; padding: 18px; border-radius: 16px; background: #fff; border: 2px solid var(--text); }
  .modal-box img.big { display: block; width: 100%; max-height: 46vh; object-fit: contain; border-radius: 10px; background: #eef0f3; }
  .modal-title { margin: 14px 0 4px; font-family: var(--display); font-weight: 900; font-size: 22px; text-align: center; }
  .modal .sz.wide { max-width: none; }
  .modal .sizes { justify-content: center; grid-template-columns: repeat(auto-fit, minmax(60px, 74px)); margin-top: 6px; }
  .modal .sz b { font-size: 28px; }
  .noimg { padding: 30px; text-align: center; border-radius: 10px; font-family: var(--display); font-weight: 900; font-size: 26px;
    background: color-mix(in srgb, var(--gc, var(--text)) 13%, #fff); color: color-mix(in srgb, var(--gc, var(--text)) 82%, #000); }
  .btn { display: block; width: 100%; margin-top: 14px; padding: 13px; border: 0; border-radius: 10px; background: var(--text); color: #fff;
    font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
  .btn.ghost { background: #fff; border: 1.5px solid var(--text); color: var(--text); }

  .guide h2 { margin: 0 0 4px; font-family: var(--display); font-weight: 900; font-size: 21px; text-align: center; }
  .guide p.lead { margin: 0 0 16px; text-align: center; font-size: 13px; color: var(--muted); }
  .step { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px; }
  .step .n { flex: 0 0 30px; height: 30px; border-radius: 50%; background: var(--text); color: #fff; font-family: var(--num); font-weight: 700; font-size: 18px; text-align: center; line-height: 30px; }
  .step div { flex: 1; line-height: 1.55; }
  .step b { display: block; font-size: 15px; }
  .step small { color: var(--muted); font-size: 13px; }
  .legend { display: flex; gap: 10px; margin-top: 8px; }
  .legend .sz { width: 56px; }

  .banner { position: fixed; left: 10px; right: 10px; bottom: 10px; z-index: 40; display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 12px;
    background: var(--text); color: #fff; box-shadow: 0 8px 22px rgba(0,0,0,.28); font-size: 13px; line-height: 1.5; }
  .banner .body { flex: 1; }
  .banner b { display: block; font-size: 14px; }
  .banner button { border: 0; border-radius: 8px; padding: 8px 12px; background: #fff; color: var(--text); font: inherit; font-weight: 700; cursor: pointer; }
  .banner .x { background: none; color: rgba(255,255,255,.6); padding: 4px 6px; font-size: 18px; }

  .toast { position: fixed; left: 50%; bottom: 20px; z-index: 100; max-width: 90%; padding: 12px 18px; border-radius: 10px; background: var(--text); color: #fff;
    font-size: 14px; font-weight: 700; opacity: 0; transform: translate(-50%, 20px); transition: opacity .25s, transform .25s; pointer-events: none; width: max-content; max-width: calc(100vw - 32px); text-align: center; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.error { background: var(--bad); }
  /* 日本語の改行：文節の途中で切らない（長すぎる語だけ最後の手段で折る） */
  body { word-break: keep-all; overflow-wrap: anywhere; line-break: strict; }
</style>
</head>
<body>

<div class="top">
  <header class="app-header">
    <div class="brand">
      <h1>コロッケ グッズ在庫</h1>
      <div class="sub">在庫確認</div>
    </div>
    <button type="button" class="hbtn" id="btnFont" aria-label="文字の大きさを変える">大</button>
    <button type="button" class="hbtn" id="btnHelp" aria-label="使い方">？</button>
    <button type="button" class="hbtn" id="reload" aria-label="最新の在庫に更新">更新</button>
  </header>
  <div class="updated-bar">
    <span id="updated"></span>
    <span class="test" id="testBadge" hidden>テスト版</span>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <p class="pool-note" id="poolNote"></p>
  <div class="controls">
    <div class="search">
      <input type="search" id="q" placeholder="名前・色・サイズで探す" autocomplete="off" enterkeyhint="search">
      <button type="button" class="clear" id="qClear" aria-label="消す" hidden>✕</button>
    </div>
    <div class="chips" id="typeChips"></div>
    <div class="row2">
      <div class="seg" id="sortSeg">
        <button type="button" data-sort="name" class="on">名前順</button>
        <button type="button" data-sort="stockDesc">多い順</button>
        <button type="button" data-sort="stockAsc">少ない順</button>
      </div>
      <label class="toggle-zero"><input type="checkbox" id="showZero">売り切れも表示</label>
    </div>
    <div class="seg view-seg" id="viewSeg">
      <button type="button" data-view="list" class="on">リスト</button>
      <button type="button" data-view="tile">写真で並べる</button>
    </div>
  </div>
</div>

<main>
  <p class="summary" id="summary"></p>
  <div id="list"><div class="empty">読み込み中…</div></div>
</main>

<div class="modal" id="detail" hidden>
  <div class="modal-box">
    <img class="big" id="detailImg" alt="" referrerpolicy="no-referrer" hidden>
    <div class="noimg" id="detailNoImg" hidden></div>
    <div class="modal-title" id="detailTitle"></div>
    <div class="tags" id="detailTags" style="justify-content:center"></div>
    <div class="sizes" id="detailSizes"></div>
    <p class="summary" id="detailNote" style="text-align:center;margin-top:12px"></p>
    <button type="button" class="btn ghost" id="detailClose">閉じる</button>
  </div>
</div>

<div class="modal" id="guide" hidden>
  <div class="modal-box guide">
    <h2>かんたんな使い方</h2>
    <p class="lead">3つだけ覚えれば大丈夫です</p>
    <div class="step"><div class="n">1</div><div><b>上のタブで場所をえらぶ</b><small id="guidePools"></small></div></div>
    <div class="step"><div class="n">2</div><div><b>商品をタップすると大きく見られます</b><small>写真とサイズごとの残りが出ます</small></div></div>
    <div class="step"><div class="n">3</div><div><b>右上の「更新」で最新の在庫になります</b><small>札の見方</small><span class="legend"><span class="sz"><i>M</i><b>12</b></span><span class="sz low"><i>わずか</i><b>2</b></span><span class="sz zero"><i>売り切れ</i><b>0</b></span></span></div></div>
    <button type="button" class="btn" id="guideClose">わかりました</button>
  </div>
</div>

<div class="banner" id="installBanner" hidden>
  <div class="body">
    <b id="installTitle">アプリのように使えます</b>
    <span id="installText"></span>
  </div>
  <button type="button" id="installBtn" hidden>追加</button>
  <button type="button" class="x" id="installClose" aria-label="閉じる">✕</button>
</div>

<div class="toast" id="toast"></div>

<script>
  // GASから開いたときは BOOT がここに埋め込まれる。
  // 埋め込み版・GitHub Pages 版（tools/build-sites.js などが BOOT=null・API_URL を設定）は起動時に取得する。
  let BOOT = null;
  const API_URL = 'https://script.google.com/macros/s/AKfycbzAASqPnaTyRfd7YgLiFCg685L4u_Sy7b6q1zudeJWNuC2RN6mYQy2gygsMDdG6mJE/exec';
  const ENV = '';

  const POOL_COLORS = ['#e67e22', '#e84393', '#27ae60', '#3498db', '#8e44ad'];
  const SORTS = ['name', 'stockDesc', 'stockAsc'];
  const STORE = 'korokke.client' + (ENV ? '.' + ENV : '');
  const CACHE_KEY = STORE + '.cache';
  const GUIDE_KEY = STORE + '.guide';
  const INSTALL_KEY = STORE + '.install';
  const FETCH_TIMEOUT_MS = 10000;

  let owners = [];
  let ownerNotes = [];
  let sizes = [];
  let threshold = 5;
  let newDays = 14;
  let deferredInstall = null;

  const state = {
    products: [],
    pool: '',
    q: '',
    type: '',
    sort: 'name',
    showZero: false,
    big: false,
    view: 'list',
    loadedAt: Date.now(),
  };

  const $ = id => document.getElementById(id);

  // ---------- サーバー呼び出し ----------
  function fetchJson(body, timeoutMs) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    return fetch(API_URL, { method: 'POST', body: JSON.stringify(body), credentials: 'omit', signal: ctrl.signal })
      .then(r => r.json())
      .finally(() => clearTimeout(timer));
  }

  /**
   * GAS内なら google.script.run、埋め込み版なら POST（Googleのログイン情報は送らない）。
   * GAS はまれに応答しないことがあるので、10秒で打ち切って最大3回までやり直す（読み取り専用なので安全）。
   */
  async function rpc(action, params) {
    if (!API_URL) {
      return new Promise((resolve, reject) => {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).api(action, params);
      });
    }
    const body = Object.assign({ action: action }, params);
    if (ENV) body.env = ENV;
    let lastError = null;
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        return await fetchJson(body, FETCH_TIMEOUT_MS);
      } catch (err) {
        lastError = err;
      }
    }
    throw new Error(lastError && lastError.name === 'AbortError'
      ? 'サーバーからの返事がありません'
      : 'つながりませんでした。電波の良い場所でお試しください');
  }

  /** 前回の在庫を端末に保存し、次に開いたときすぐ表示する */
  function saveCache(config, products) {
    store(CACHE_KEY, JSON.stringify({ at: Date.now(), config: config, products: products }));
  }

  function loadCache() {
    try {
      const cached = JSON.parse(stored(CACHE_KEY) || 'null');
      return cached && cached.config && Array.isArray(cached.products) ? cached : null;
    } catch (e) {
      return null;
    }
  }

  function store(key, value) {
    try {
      if (value === null) localStorage.removeItem(key);
      else localStorage.setItem(key, value);
    } catch (e) { /* 保存できない環境 */ }
  }

  function stored(key) {
    try {
      return localStorage.getItem(key);
    } catch (e) {
      return null;
    }
  }

  // ---------- 文字のあつかい ----------
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  /** ひらがな・カタカナ・全角半角・大文字小文字・長音の違いを無くして探せるようにする */
  function norm(s) {
    return String(s == null ? '' : s)
      .normalize('NFKC').toLowerCase()
      .replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60))
      .replace(/ティー/g, 't')
      .replace(/[\s・ー-]/g, '');
  }

  // 「しろ」「ホワイト」でも白が出るように
  const COLOR_WORDS = {
    '白': 'しろ ホワイト', '黒': 'くろ ブラック', '赤': 'あか レッド', '青': 'あお ブルー',
    '黄': 'きいろ イエロー', '黄緑': 'きみどり', '緑': 'みどり グリーン', '紫': 'むらさき パープル',
    'ピンク': 'もも 桃', 'ゴールド': 'きん 金', 'シルバー': 'ぎん 銀', 'オレンジ': 'だいだい',
    'レインボー': 'にじ 虹', '灰': 'グレー', '茶': 'ブラウン',
  };
  const TYPE_WORDS = { 'Tシャツ': 'ティーシャツ tshirt', 'タオル': 'towel', 'マフラータオル': 'まふらー towel', 'キーホルダー': 'キーホルダ' };

  function searchText(p) {
    let extra = '';
    Object.keys(COLOR_WORDS).forEach(k => { if (p.color.indexOf(k) >= 0) extra += ' ' + COLOR_WORDS[k]; });
    Object.keys(TYPE_WORDS).forEach(k => { if (p.type.indexOf(k) >= 0) extra += ' ' + TYPE_WORDS[k]; });
    return norm([p.id, p.category, p.type, p.color, p.size, extra].join(' '));
  }

  function cmp(a, b) {
    return a < b ? -1 : a > b ? 1 : 0;
  }

  function sizeRank(size) {
    const i = sizes.indexOf(size);
    return i < 0 ? sizes.length : i;
  }

  /** 在庫の状態（色と言葉） */
  function stateOf(n) {
    if (n <= 0) return { cls: 'zero', word: '売り切れ' };
    if (n <= threshold) return { cls: 'low', word: 'のこりわずか' };
    return { cls: 'ok', word: 'あり' };
  }

  function isNew(p) {
    if (!p.createdAt) return false;
    const t = Date.parse(p.createdAt + 'T00:00:00');
    return !isNaN(t) && Date.now() - t < newDays * 24 * 3600 * 1000;
  }

  function poolColor(pool) {
    return POOL_COLORS[Math.max(0, owners.indexOf(pool)) % POOL_COLORS.length];
  }

  function imageSrc(url, width) {
    const m = /\/d\/([\w-]{20,})|[?&]id=([\w-]{20,})/.exec(url || '');
    const id = m ? m[1] || m[2] : '';
    return id ? 'https://lh3.googleusercontent.com/d/' + id + '=w' + width : url;
  }

  // ジャンルの色（虹の7色。販売レジ・管理画面と同じ）
  const FAMILY = [['t', /シャツ/], ['towel', /タオル|手ぬぐい/], ['file', /ファイル/], ['knit', /ニット|ストール|帽/],
    ['key', /キー|ストラップ/], ['mag', /マグネット|ステッカー/], ['goods', /./]];
  const famOf = t => (FAMILY.find(f => f[1].test(t || '')) || FAMILY[6])[0];
  const gc = t => '--gc:var(--g-' + famOf(t) + ')';
  const SWATCH = { 'ゴールド': '#d4ae4a', 'シルバー': '#c3c8cf', 'ピンク': '#f19cbb', '緑': '#3d9a5b', '黄': '#f2d14b', '黄緑': '#a6d151', '白': '#fff', '青': '#2f63d6',
    '赤': '#d8392f', '黒': '#1b1b1b', 'グレー': '#9ea4ab', 'オレンジ': '#f08a24', '青白': 'linear-gradient(90deg,#2f63d6 50%,#fff 50%)',
    'レインボー': 'conic-gradient(#e53935,#fb8c00,#fdd835,#43a047,#1e88e5,#8e24aa,#e53935)' };
  const swatch = c => { const k = Object.keys(SWATCH).find(x => c.indexOf(x) === 0); return k ? SWATCH[k] : ''; };

  let toastTimer = null;
  function toast(message, isError) {
    const el = $('toast');
    el.textContent = message;
    el.className = 'toast show' + (isError ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = 'toast' + (isError ? ' error' : ''); }, isError ? 5000 : 2000);
  }

  // ---------- 表示設定の保存 ----------
  function loadPrefs() {
    try {
      const saved = JSON.parse(stored(STORE) || '{}');
      if (owners.indexOf(saved.pool) >= 0) state.pool = saved.pool;
      if (SORTS.indexOf(saved.sort) >= 0) state.sort = saved.sort;
      state.showZero = saved.showZero === true;
      state.big = saved.big === true;
      state.view = saved.view === 'tile' ? 'tile' : 'list';
    } catch (e) { /* 保存できない環境 */ }
  }

  function savePrefs() {
    store(STORE, JSON.stringify({ pool: state.pool, sort: state.sort, showZero: state.showZero, big: state.big, view: state.view }));
  }

  // ---------- 同じ商品のサイズ違いは1枚のカードにまとめる ----------
  function groupsOf() {
    const q = norm(state.q);
    const groups = [];
    const byKey = {};
    state.products.forEach(p => {
      if (state.type === '__new__') {
        if (!isNew(p)) return;
      } else if (state.type && p.type !== state.type) {
        return;
      }
      if (q && searchText(p).indexOf(q) < 0) return;
      const key = [p.category, p.type, p.color].join(' |');
      let g = byKey[key];
      if (!g) {
        g = byKey[key] = { key: key, category: p.category, type: p.type, color: p.color, items: [], total: 0, imageUrl: '', isNew: false };
        groups.push(g);
      }
      const n = p.stock[state.pool] || 0;
      g.items.push({ p: p, n: n });
      g.total += n;
      if (!g.imageUrl && p.imageUrl) g.imageUrl = p.imageUrl;
      if (isNew(p)) g.isNew = true;
    });
    groups.forEach(g => g.items.sort((a, b) => sizeRank(a.p.size) - sizeRank(b.p.size) || cmp(a.p.id, b.p.id)));
    return state.showZero ? groups : groups.filter(g => g.total > 0);
  }

  function sortGroups(groups) {
    // 名前順はカテゴリを商品IDの若い順（元の在庫表の並び）に
    const rank = {};
    state.products.slice().sort((a, b) => cmp(a.id, b.id)).forEach(p => {
      if (!(p.category in rank)) rank[p.category] = Object.keys(rank).length;
    });
    // 管理画面で「売り場の並び順」を決めていればその順（商品名ごとのまとまりは崩さない）
    const order = (BOOT && BOOT.config && BOOT.config.displayOrder) || [];
    const pos = {};
    order.forEach((k, i) => { pos[k] = i; });
    if (order.length) {
      Object.keys(rank).forEach(c => { rank[c] = 1e6 + rank[c]; });
      order.forEach((k, i) => { const c = k.split('|')[0]; if (c in rank && rank[c] >= 1e6) rank[c] = i; });
    }
    const gpos = g => { const k = [g.category, g.type, g.color].join('|'); return k in pos ? pos[k] : 1e6; };
    const byName = (a, b) => (rank[a.category] - rank[b.category]) || (gpos(a) - gpos(b)) || cmp(a.type, b.type) || cmp(a.color, b.color);
    const sorters = {
      name: byName,
      stockDesc: (a, b) => (b.total - a.total) || byName(a, b),
      stockAsc: (a, b) => (a.total - b.total) || byName(a, b),
    };
    return groups.slice().sort(sorters[state.sort] || byName);
  }

  // ---------- 描画 ----------
  function renderTabs() {
    $('tabs').innerHTML = owners.map(o => {
      const total = state.products.reduce((sum, p) => sum + (p.stock[o] || 0), 0);
      return '<button type="button" class="tab' + (o === state.pool ? ' active' : '') + '" data-pool="' + esc(o) +
        '" style="--tab-color:' + poolColor(o) + '">' + esc(o) + '<small>' + total + '点</small></button>';
    }).join('');
    const note = ownerNotes[owners.indexOf(state.pool)] || '';
    $('poolNote').textContent = note;
    $('poolNote').hidden = !note;
    document.documentElement.style.setProperty('--theme', poolColor(state.pool));
  }

  function renderChips() {
    const types = [];
    state.products.forEach(p => {
      if (((p.stock[state.pool] || 0) > 0 || state.showZero) && types.indexOf(p.type) < 0) types.push(p.type);
    });
    const hasNew = state.products.some(p => isNew(p) && ((p.stock[state.pool] || 0) > 0 || state.showZero));
    const chip = (value, label) => '<button type="button" data-type="' + esc(value) + '"' +
      (state.type === value ? ' class="on"' : '') + '>' + esc(label) + '</button>';
    types.sort((a, b) => FAMILY.findIndex(f => f[0] === famOf(a)) - FAMILY.findIndex(f => f[0] === famOf(b)));
    const chipC = (value, label, style) => '<button type="button" data-type="' + esc(value) + '"' + (style ? ' style="' + style + '"' : '') +
      (state.type === value ? ' class="on"' : '') + '><i></i>' + esc(label) + '</button>';
    $('typeChips').innerHTML = chip('', 'すべて') + types.map(t => chipC(t, t, gc(t))).join('') + (hasNew ? chip('__new__', '新着') : '');
  }

  // 数え方（Tシャツ・タオルなどは「枚」、ペンライトなどは「本」、それ以外は「個」。種類が混ざる合計は「点」）
  const UNIT_MAI = ['Tシャツ', 'ワイシャツ', 'タオル', 'マフラータオル', 'スポーツタオル', 'ハンドタオル', '手ぬぐい',
    'B5クリアファイル', 'クリアファイル', 'ステッカー', 'ストール'];
  const UNIT_HON = ['ペンライト', '傘', 'ストラップ', 'ネックストラップ'];
  function unitOf(type) {
    return UNIT_MAI.indexOf(type) >= 0 ? '枚' : UNIT_HON.indexOf(type) >= 0 ? '本' : '個';
  }

  // サイズのハンガー札（サイズがない商品は「在庫 ○個」の横長の札）
  function sizeChipsHtml(g) {
    return g.items.map(x => {
      const st = stateOf(x.n);
      const hasSize = x.p.size && x.p.size !== '-';
      return hasSize ? '<span class="sz ' + st.cls + '"><i>' + esc(x.p.size) + '</i><b>' + x.n + '</b></span>'
        : '<span class="sz wide ' + st.cls + '"><i>在庫</i><b>' + x.n + '</b><i>' + unitOf(g.type) + '</i></span>';
    }).join('');
  }
  const thumbNone = (g, cls) => '<div class="' + cls + ' none" style="' + gc(g.type) + '">' + esc(g.category) + '</div>';

  function groupHtml(g, grouped) {
    const st = stateOf(g.total);
    const thumb = g.imageUrl
      ? '<img class="thumb" src="' + esc(imageSrc(g.imageUrl, 260)) + '" alt="" loading="lazy" referrerpolicy="no-referrer">'
      : thumbNone(g, 'thumb');
    const counts = '<div class="sizes">' + sizeChipsHtml(g) + '</div>' + (st.cls === 'low' ? '<span class="state">のこりわずか</span>' : '');
    const tags = (grouped ? [] : [g.type]).map(v => '<span class="tag">' + esc(v) + '</span>').join('') +
      (g.color && g.color !== '-' ? '<span class="tag"' + (swatch(g.color) ? ' style="--cc:' + swatch(g.color) + '"' : '') + '><i></i>' + esc(g.color) + '</span>' : '');
    return '<button type="button" class="item' + (g.total > 0 ? '' : ' soldout') + '" data-key="' + esc(g.key) + '">' + thumb +
      '<div class="info"><div class="name">' + esc(grouped ? g.type : g.category) +
      (g.isNew ? '<span class="new">NEW</span>' : '') + '</div>' +
      '<div class="tags">' + tags + '</div>' + counts + '</div></button>';
  }

  function emptyHtml() {
    const message = state.q
      ? '「' + esc(state.q) + '」に合う商品は見つかりませんでした'
      : (state.type ? 'この種類の在庫はありません' : esc(state.pool) + 'に在庫がある商品はありません');
    return '<div class="empty">' + message +
      (state.q ? '<br><button type="button" class="link" data-action="clear-q">検索をやめてすべて表示</button>' : '') +
      (state.showZero ? '' : '<br><button type="button" class="link" data-action="show-zero">売り切れの商品も表示する</button>') +
      '</div>';
  }

  function render() {
    document.body.classList.toggle('tiles', state.view === 'tile');
    document.querySelectorAll('#viewSeg button').forEach(b => b.classList.toggle('on', b.dataset.view === state.view));
    renderTabs();
    renderChips();
    const groups = sortGroups(groupsOf());
    const total = groups.reduce((sum, g) => sum + g.total, 0);
    const items = groups.reduce((sum, g) => sum + g.items.length, 0);
    $('summary').innerHTML = '<b>' + items + '</b>件 ／ 合計 <b>' + total + '</b>点' +
      (state.q ? '（「' + esc(state.q) + '」で検索中）' : '');

    if (!groups.length) {
      $('list').innerHTML = emptyHtml();
      return;
    }
    if (state.sort !== 'name') {
      $('list').innerHTML = groups.map(g => groupHtml(g, false)).join('');
      return;
    }
    const blocks = [];
    groups.forEach(g => {
      const last = blocks[blocks.length - 1];
      if (last && last.category === g.category) last.groups.push(g);
      else blocks.push({ category: g.category, groups: [g] });
    });
    $('list').innerHTML = blocks.map(b =>
      '<h2 class="group-title" style="' + gc(b.groups[0].type) + '"><b>' + esc(b.category) + '</b>' +
      '<span><span class="n">' + b.groups.reduce((sum, g) => sum + g.total, 0) + '</span>点</span></h2>' +
      b.groups.map(g => groupHtml(g, true)).join('')).join('');
  }

  /** 「3分前の在庫です」のように、いつの在庫かをやさしく出す */
  function stampUpdated() {
    const diff = Date.now() - state.loadedAt;
    const d = new Date(state.loadedAt);
    let when;
    if (diff < 60000) when = 'たった今';
    else if (diff < 3600000) when = Math.floor(diff / 60000) + '分前';
    else if (diff < 12 * 3600000) when = Math.floor(diff / 3600000) + '時間前';
    else when = (d.getMonth() + 1) + '月' + d.getDate() + '日';
    $('updated').textContent = when + 'の在庫です（「更新」で最新に）';
  }

  // ---------- くわしく見る ----------
  function openDetail(key) {
    const g = groupsOf().find(x => x.key === key);
    if (!g) return;
    $('detailImg').hidden = !g.imageUrl;
    $('detailNoImg').hidden = !!g.imageUrl;
    if (g.imageUrl) $('detailImg').src = imageSrc(g.imageUrl, 900);
    else { $('detailNoImg').textContent = g.category; $('detailNoImg').setAttribute('style', gc(g.type)); }
    $('detailTitle').innerHTML = esc(g.category) + (g.isNew ? '<span class="new">NEW</span>' : '');
    $('detailTags').innerHTML = [g.type, g.color].filter(v => v && v !== '-')
      .map(v => '<span class="tag">' + esc(v) + '</span>').join('　');
    $('detailSizes').innerHTML = sizeChipsHtml(g);
    const st = stateOf(g.total);
    $('detailNote').textContent = state.pool + 'の在庫：合計 ' + g.total + unitOf(g.type) + '（' + st.word + '）';
    $('detail').hidden = false;
  }

  // ---------- 最新の在庫を取得 ----------
  function reload(silent) {
    const btn = $('reload');
    const done = () => { btn.disabled = false; btn.classList.remove('spin'); };
    btn.disabled = true;
    btn.classList.add('spin');
    rpc('getBootData', {})
      .then(res => {
        done();
        if (!res || !res.ok) return toast('最新の在庫を読み込めませんでした：' + (res ? res.error : '返事がありません'), true);
        applyConfig(res.data.config);
        state.products = res.data.products;
        state.loadedAt = Date.now();
        saveCache(res.data.config, res.data.products);
        stampUpdated();
        render();
        if (!silent) toast('最新の在庫にしました');
      })
      .catch(err => {
        done();
        toast('最新の在庫を読み込めませんでした（' + (err && err.message ? err.message : err) + '）。電波の良い場所で「更新」を押してください', true);
      });
  }

  function applyConfig(config) {
    BOOT.config = config;
    owners = config.owners;
    ownerNotes = config.ownerNotes || owners.map(() => '');
    sizes = config.sizes;
    threshold = config.lowStockThreshold;
    newDays = config.newDays || 14;
    if (owners.indexOf(state.pool) < 0) state.pool = owners[0];
    $('testBadge').hidden = config.env !== 'test';
  }

  // ---------- 使い方・ホーム画面への追加 ----------
  function showGuide() {
    $('guidePools').textContent = owners.join('・') + 'を切り替えられます';
    $('guide').hidden = false;
  }

  /** 案内バナーは15秒たったら自動で消す（また次に開いたときに出る） */
  function autoHideBanner() {
    setTimeout(() => { $('installBanner').hidden = true; }, 15000);
  }

  function maybeShowInstall() {
    if (stored(INSTALL_KEY) === 'no') return;
    const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if (standalone || window.top !== window.self) return;
    const ua = navigator.userAgent;
    const banner = $('installBanner');
    if (/Line\//i.test(ua)) {
      $('installTitle').textContent = 'ブラウザで開くと見やすくなります';
      $('installText').textContent = '右下の「︙」や「↗」から Safari / Chrome で開いてください';
      banner.hidden = false;
      autoHideBanner();
      return;
    }
    if (/iPhone|iPad|iPod/.test(ua)) {
      $('installText').textContent = '下の［共有］ボタン →「ホーム画面に追加」で、アプリのように開けます';
      banner.hidden = false;
      autoHideBanner();
      return;
    }
    if (deferredInstall) {
      $('installText').textContent = 'ホーム画面に追加すると、次から1タップで開けます';
      $('installBtn').hidden = false;
      banner.hidden = false;
      autoHideBanner();
      return;
    }
    if (/Android/.test(ua)) {
      $('installText').textContent = '右上の「︙」→「ホーム画面に追加」で、アプリのように開けます';
      banner.hidden = false;
      autoHideBanner();
    }
  }

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredInstall = e;
    if ($('guide').hidden) maybeShowInstall();
  });

  // ---------- 初期化 ----------
  function init() {
    loadPrefs();
    document.body.classList.toggle('big', state.big);
    $('btnFont').classList.toggle('on', state.big);
    $('showZero').checked = state.showZero;
    document.querySelectorAll('#sortSeg button').forEach(b => b.classList.toggle('on', b.dataset.sort === state.sort));
    stampUpdated();
    render();
    setInterval(stampUpdated, 30000);

    $('tabs').addEventListener('click', e => {
      const tab = e.target.closest('[data-pool]');
      if (!tab) return;
      state.pool = tab.dataset.pool;
      savePrefs();
      render();
      window.scrollTo(0, 0);
    });
    $('q').addEventListener('input', e => {
      state.q = e.target.value;
      $('qClear').hidden = !state.q;
      render();
    });
    $('qClear').addEventListener('click', () => {
      $('q').value = '';
      state.q = '';
      $('qClear').hidden = true;
      render();
    });
    $('typeChips').addEventListener('click', e => {
      const b = e.target.closest('[data-type]');
      if (!b) return;
      state.type = b.dataset.type === state.type ? '' : b.dataset.type;
      render();
    });
    $('viewSeg').addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      state.view = b.dataset.view;
      savePrefs();
      render();
    });
    $('sortSeg').addEventListener('click', e => {
      const b = e.target.closest('[data-sort]');
      if (!b) return;
      state.sort = b.dataset.sort;
      document.querySelectorAll('#sortSeg button').forEach(x => x.classList.toggle('on', x === b));
      savePrefs();
      render();
    });
    $('showZero').addEventListener('change', e => {
      state.showZero = e.target.checked;
      savePrefs();
      render();
    });
    $('btnFont').addEventListener('click', () => {
      state.big = !state.big;
      document.body.classList.toggle('big', state.big);
      $('btnFont').classList.toggle('on', state.big);
      savePrefs();
      toast(state.big ? '文字を大きくしました' : '文字の大きさを元に戻しました');
    });
    $('btnHelp').addEventListener('click', showGuide);
    $('reload').addEventListener('click', () => reload(false));
    $('list').addEventListener('click', e => {
      if (e.target.closest('[data-action="show-zero"]')) {
        state.showZero = true;
        $('showZero').checked = true;
        savePrefs();
        return render();
      }
      if (e.target.closest('[data-action="clear-q"]')) {
        $('q').value = '';
        state.q = '';
        $('qClear').hidden = true;
        return render();
      }
      const item = e.target.closest('[data-key]');
      if (item) openDetail(item.dataset.key);
    });
    $('detailClose').addEventListener('click', () => { $('detail').hidden = true; });
    $('detail').addEventListener('click', e => { if (e.target === $('detail')) $('detail').hidden = true; });
    $('guideClose').addEventListener('click', () => {
      $('guide').hidden = true;
      store(GUIDE_KEY, 'done');
      maybeShowInstall();
    });
    $('installClose').addEventListener('click', () => {
      $('installBanner').hidden = true;
      store(INSTALL_KEY, 'no');
    });
    $('installBtn').addEventListener('click', () => {
      $('installBanner').hidden = true;
      if (deferredInstall) {
        deferredInstall.prompt();
        deferredInstall = null;
      }
    });
    // 開きっぱなしのページに戻ってきたら、5分以上たっていれば自動で最新にする
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && Date.now() - state.loadedAt > 5 * 60 * 1000) reload(true);
    });

    if (!stored(GUIDE_KEY)) showGuide();
    else maybeShowInstall();
    if (!BOOT.ok) toast('在庫の読み込みに失敗しました：' + BOOT.error, true);
  }

  function start(boot, loadedAt) {
    BOOT = boot;
    applyConfig(boot.config);
    state.pool = owners[0];
    state.products = boot.products || [];
    state.loadedAt = loadedAt || Date.now();
    init();
  }

  if (BOOT) {
    start(BOOT);
  } else {
    // 前回の在庫があればすぐ表示し、最新は裏で取り直す（GAS の応答待ちで止まって見えないように）
    const cached = loadCache();
    if (cached) {
      start(Object.assign({ ok: true }, cached), cached.at);
      reload(true);
    } else {
      rpc('getBootData', {})
        .then(res => {
          if (!res || !res.ok) throw new Error(res ? res.error : '返事がありません');
          saveCache(res.data.config, res.data.products);
          start(Object.assign({ ok: true }, res.data));
        })
        .catch(err => {
          $('list').innerHTML = '<div class="empty">在庫を読み込めませんでした（' + esc(err.message) + '）' +
            '<br><button type="button" class="link" onclick="location.reload()">もう一度読み込む</button></div>';
        });
    }
  }
</script>
</body>
</html>
