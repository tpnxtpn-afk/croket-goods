<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#121418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="テストレジ">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest-register.webmanifest">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" type="image/png" href="../icon-192.png">
<title>【テスト】販売レジ</title>
<style>
  :root {
    --bg: #eef1f5; --panel: #fff; --ink: #1f2a37; --muted: #6b7684; --line: #dde3ea;
    --accent: #e67e22; --accent-d: #c8650f; --sale: #e74c3c; --ok: #27ae60; --navy: #121418;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; background: var(--bg); color: var(--ink);
    -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
  button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
  input { font: inherit; }

  /* ---------- 画面の骨組み（横向きiPad：ジャンル｜商品｜カゴ） ---------- */
  .app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top, 0px));
    background: var(--navy); color: #fff; }
  header h1 { margin: 0; font-size: 20px; letter-spacing: .04em; white-space: nowrap; }
  header .badge { white-space: nowrap; flex: none; background: var(--sale); color: #fff; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
  .hfield { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.1); border-radius: 10px; padding: 6px 10px; }
  .hfield span { font-size: 12px; opacity: .75; white-space: nowrap; }
  .hfield input, .hfield select { background: transparent; border: none; color: #fff; font-size: 16px; width: 150px; min-width: 0; outline: none; }
  @media (max-width: 1250px) { .hfield input, .hfield select { width: 120px; } .net { font-size: 12px; } }
  .hfield select option { color: #000; }
  .spacer { flex: 1; }
  .net { font-size: 13px; padding: 6px 10px; border-radius: 999px; background: rgba(39,174,96,.25); white-space: nowrap; }
  .net.off { background: rgba(231,76,60,.35); }
  .hbtn { background: rgba(255,255,255,.12); color: #fff; border-radius: 10px; padding: 8px 12px; font-size: 15px; white-space: nowrap; }

  .main { display: grid; grid-template-columns: 180px minmax(0, 1fr) 350px; min-height: 0; }
  .cart h2 { gap: 8px; }
  .genre { word-break: keep-all; overflow-wrap: anywhere; }
  nav.genres { overflow-y: auto; padding: 10px 8px; background: #f7f8fa; border-right: 1px solid var(--line); }
  .genre { display: block; width: 100%; text-align: left; padding: 14px 12px; margin-bottom: 6px; border-radius: 12px;
    font-size: 16px; font-weight: 700; color: var(--muted); }
  .genre small { display: block; font-size: 12px; font-weight: 400; }
  .genre.on { background: var(--accent); color: #fff; }

  section.items { overflow-y: auto; padding: 14px; min-height: 0; }
  .search { display: flex; gap: 10px; margin-bottom: 12px; }
  .search input { flex: 1; font-size: 18px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .tile { position: relative; background: var(--panel); border-radius: 16px; overflow: hidden; text-align: left;
    box-shadow: 0 1px 3px rgba(0,0,0,.08); display: flex; flex-direction: column; transition: transform .08s; }
  .tile:active { transform: scale(.97); }
  .tile .ph { aspect-ratio: 1 / 1; background: #e9edf2 center/cover no-repeat; display: grid; place-items: center; font-size: 54px; }
  .tile .tx { padding: 8px 10px 10px; }
  .tile b { display: block; font-size: 17px; line-height: 1.25; word-break: keep-all; overflow-wrap: anywhere; }
  .tile .sub { font-size: 13px; color: var(--muted); margin-top: 2px; word-break: keep-all; overflow-wrap: anywhere; }
  .tile .stk { font-size: 13px; margin-top: 4px; color: var(--ok); font-weight: 700; }
  .tile .stk.low { color: var(--accent-d); }
  .tile.zero { opacity: .45; }
  .tile.zero .stk { color: var(--sale); }
  .tile .incart { position: absolute; top: 8px; right: 8px; min-width: 34px; height: 34px; border-radius: 17px; padding: 0 8px;
    background: var(--sale); color: #fff; font-weight: 800; font-size: 18px; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; font-size: 17px; }

  /* ---------- カゴ ---------- */
  aside.cart { display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line); min-height: 0; }
  .cart h2 { margin: 0; padding: 14px 16px 10px; font-size: 19px; display: flex; justify-content: space-between; align-items: baseline; }
  .cart h2 button { font-size: 14px; color: var(--muted); }
  .lines { flex: 1; overflow-y: auto; padding: 0 12px; }
  .line { display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); }
  .line .th { width: 48px; height: 48px; border-radius: 8px; background: #e9edf2 center/cover; display: grid; place-items: center; font-size: 22px; }
  .line b { display: block; font-size: 16px; }
  .line small { color: var(--muted); font-size: 13px; word-break: keep-all; overflow-wrap: anywhere; }
  .qty { display: flex; align-items: center; gap: 4px; }
  .qty button { width: 44px; height: 44px; border-radius: 12px; background: #f0f2f5; font-size: 24px; font-weight: 700; }
  .qty span { min-width: 34px; text-align: center; font-size: 20px; font-weight: 800; }
  .cart-empty { color: var(--muted); text-align: center; padding: 40px 10px; line-height: 1.8; }
  .sum { padding: 12px 16px; border-top: 2px solid var(--ink); }
  .sum .row { display: flex; justify-content: space-between; font-size: 17px; margin: 2px 0; }
  .sum .row.big { font-size: 26px; font-weight: 800; }
  .sum .note { font-size: 12px; color: var(--muted); }
  .pay { margin: 0 16px calc(14px + var(--safe-b)); padding: 18px; border-radius: 16px; background: var(--sale); color: #fff;
    font-size: 22px; font-weight: 800; letter-spacing: .05em; }
  .pay:disabled { background: #c9cfd6; }
  .log { border-top: 1px solid var(--line); max-height: 34%; overflow-y: auto; padding: 8px 16px 10px; font-size: 13px; }
  .log h3 { margin: 4px 0 6px; font-size: 14px; color: var(--muted); }
  .log .ent { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
  .log .ent.pending { color: var(--accent-d); }
  .log .ent.undone { color: var(--muted); text-decoration: line-through; }
  .log .ent span { min-width: 0; }
  .log .ent .what { display: block; color: var(--ink); font-size: 13px; line-height: 1.5; margin-top: 2px; }
  .log .ent.undone .what { color: var(--muted); }
  .log .ent { align-items: flex-start; }
  .log .ent button { color: var(--sale); font-size: 13px; white-space: nowrap; }

  /* ---------- サイズを選ぶ画面 ---------- */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; z-index: 20; }
  .sheet { background: #fff; border-radius: 22px; width: min(620px, 92vw); padding: 22px; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
  .sheet .hd { display: flex; gap: 16px; align-items: center; margin-bottom: 16px; }
  .sheet .hd .ph { width: 96px; height: 96px; border-radius: 14px; background: #e9edf2 center/cover; display: grid; place-items: center; font-size: 40px; flex: none; }
  .sheet .hd b { font-size: 22px; display: block; }
  .sheet .hd small { color: var(--muted); font-size: 15px; }
  .sizes { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
  .size { border: 2px solid var(--line); border-radius: 16px; padding: 14px 8px; text-align: center; }
  .size b { display: block; font-size: 30px; }
  .size small { font-size: 14px; color: var(--muted); }
  .size:active { background: #fff4e8; border-color: var(--accent); }
  .size:disabled { opacity: .35; }
  .size .c { display: inline-block; margin-top: 4px; background: var(--sale); color: #fff; border-radius: 10px; padding: 0 8px; font-weight: 700; font-size: 14px; }
  .sheet .close { margin-top: 18px; width: 100%; padding: 14px; border-radius: 14px; background: #f0f2f5; font-size: 18px; font-weight: 700; }

  /* ---------- おつり・セット・締め ---------- */
  .change { padding: 8px 16px 4px; border-top: 1px dashed var(--line); }
  .change .crow { display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .change .crow input { flex: 1; min-width: 0; font-size: 20px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 10px; text-align: right; }
  .change .crow button { font-size: 13px; color: var(--muted); }
  .change .cbtns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px; }
  .change .cbtns button { padding: 8px 2px; border-radius: 10px; background: #f0f2f5; font-size: 14px; font-weight: 700; }
  .change .cout { min-height: 30px; text-align: right; font-size: 18px; margin-top: 4px; }
  .change .cout b { font-size: 26px; color: var(--ok); }
  .change .cout .short { color: var(--sale); font-weight: 700; }
  .tile.settile { background: #fff7ee; border: 2px dashed var(--accent); }
  .tile.settile .ph { background: #fde9d3; }
  .setpick .size { display: grid; justify-items: center; gap: 2px; padding: 8px; }
  .setpick .sph { width: 72px; height: 72px; border-radius: 10px; background: #e9edf2 center/cover; }
  .setpick .sn { font-size: 15px !important; }
  .setbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .setbtns .ok { background: var(--sale); color: #fff; }
  .setbtns .ok:disabled { background: #c9cfd6; }
  .shime { background: #fff; border: 2px solid var(--ink); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
  .shime .shrow { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-top: 6px; font-size: 16px; }
  .shime input { width: 140px; font-size: 18px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 10px; text-align: right; }
  .shime .ok { color: var(--ok); font-weight: 800; }
  .shime .ng { color: var(--sale); font-weight: 800; }

  /* ---------- 売れたもの ---------- */
  .sales { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
  .sales-hd { background: #fff; padding: 12px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
  .sales-hd h2 { margin: 0; font-size: 22px; }
  .sales-hd .back { justify-self: start; color: var(--accent-d); font-weight: 700; font-size: 16px; }
  .sales-filter { display: flex; gap: 8px; }
  .sales-filter select { flex: 1; font-size: 17px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: #fff; }
  .hbtn2 { padding: 0 16px; border-radius: 10px; background: #f0f2f5; font-size: 20px; }
  .seg2 { display: grid; grid-template-columns: 1fr 1fr; background: #f0f2f5; border-radius: 12px; padding: 4px; }
  .seg2 button { padding: 10px; border-radius: 9px; font-size: 16px; font-weight: 700; color: var(--muted); }
  .seg2 button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .sales-sum { display: flex; gap: 18px; font-size: 16px; color: var(--muted); }
  .sales-sum b { color: var(--ink); font-size: 22px; margin-right: 2px; }
  .sales-body { flex: 1; overflow-y: auto; padding: 12px 16px calc(20px + var(--safe-b)); }
  .sale { background: #fff; border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .sale .top { display: flex; gap: 10px; align-items: baseline; font-size: 15px; color: var(--muted); }
  .sale .top b { color: var(--ink); font-size: 18px; }
  .sale .top .amt { margin-left: auto; color: var(--ink); font-weight: 700; }
  .sale ul { margin: 6px 0 0; padding: 0; list-style: none; font-size: 16px; line-height: 1.7; }
  .sale ul li span { color: var(--muted); }
  .sale.undone { opacity: .5; }
  .sale.undone ul { text-decoration: line-through; }
  .rank { background: #fff; border-radius: 14px; overflow: hidden; }
  .rank .r { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); font-size: 17px; }
  .rank .r .no { color: var(--muted); font-weight: 700; text-align: center; }
  .rank .r small { display: block; color: var(--muted); font-size: 13px; }
  .rank .r .n { font-size: 24px; font-weight: 800; }
  .rank .r .n small { display: inline; font-size: 14px; font-weight: 400; margin-left: 2px; }
  .rank .gh { padding: 8px 14px; background: #f7f8fa; font-weight: 700; font-size: 14px; color: var(--muted); }
  @media (min-width: 900px) { .sales-hd { grid-template-columns: auto 1fr auto; align-items: center; } .sales-hd .seg2, .sales-hd .sales-sum { grid-column: 1 / -1; } }

  /* ---------- お知らせ ---------- */
  .toast { position: fixed; left: 50%; bottom: calc(26px + var(--safe-b)); transform: translateX(-50%); background: var(--ink); color: #fff;
    padding: 14px 22px; border-radius: 14px; font-size: 17px; z-index: 40; box-shadow: 0 8px 24px rgba(0,0,0,.3); max-width: 90vw; }
  .toast.err { background: var(--sale); }
  .login { position: fixed; inset: 0; background: var(--bg); display: grid; place-items: center; z-index: 50; }
  .login form { background: #fff; padding: 28px; border-radius: 20px; width: min(420px, 90vw); box-shadow: 0 10px 30px rgba(0,0,0,.12); }
  .login h2 { margin: 0 0 6px; }
  .login p { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
  .login input { width: 100%; font-size: 18px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; }
  .login button { width: 100%; padding: 14px; border-radius: 12px; background: var(--accent); color: #fff; font-size: 18px; font-weight: 700; }

  .hsets { display: contents; }
  .phone-only { display: none !important; }

  /* ---------- iPhone（幅600px以下）：写真2列、お会計は下のバーから開く ---------- */
  @media (max-width: 600px) {
    .phone-only { display: inline-flex !important; }
    header { flex-wrap: wrap; gap: 8px; padding: 8px 12px; padding-top: calc(8px + env(safe-area-inset-top, 0px)); }
    header h1 { font-size: 18px; }
    header .spacer, #reload { display: none; }
    #salesBtn { font-size: 13px; padding: 6px 10px; }
    .net { font-size: 11px; padding: 4px 8px; margin-left: auto; }
    .hsets { display: none; width: 100%; flex-direction: column; gap: 6px; }
    .hsets.open { display: flex; }
    .hfield input, .hfield select { width: 100%; flex: 1; }
    .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
    nav.genres { display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; border-right: none; border-bottom: 1px solid var(--line); padding: 8px; }
    .genre { width: auto; white-space: nowrap; margin: 0; padding: 8px 12px; font-size: 15px; }
    .genre small { display: none; }
    section.items { padding: 10px 10px calc(84px + var(--safe-b)); }
    .search input { font-size: 16px; padding: 10px 12px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .tile b { font-size: 15px; }
    .tile .sub { font-size: 12px; }
    .cartbar { position: fixed; left: 10px; right: 10px; bottom: calc(10px + var(--safe-b)); z-index: 15; align-items: center; gap: 12px;
      padding: 14px 18px; border-radius: 16px; background: var(--sale); color: #fff; font-size: 17px; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
    .cartbar b { margin-left: auto; font-size: 18px; }
    .cartbar.empty { background: #9aa3ad; }
    aside.cart { position: fixed; inset: 0; z-index: 25; max-height: none; border: none; transform: translateY(100%); transition: transform .2s; padding-top: env(safe-area-inset-top, 0px); }
    aside.cart.open { transform: none; }
    .cart h2 { flex-wrap: wrap; gap: 6px; }
    .cart h2 .back { width: 100%; font-size: 16px; color: var(--accent-d); font-weight: 700; padding: 4px 0 8px; }
    .log { display: block; max-height: 22%; }
    .sizes { grid-template-columns: repeat(2, 1fr); }
    .sheet { padding: 16px; }
  }

  /* ---------- 縦向き（幅が狭いとき）：ジャンルを上、カゴを下に ---------- */
  @media (min-width: 601px) and (max-width: 900px) {
    header { flex-wrap: wrap; }
    header .spacer { display: none; }
    .hfield { flex: 1 1 200px; }
    .hfield input, .hfield select { width: 100%; }
    .main { min-width: 0; }
    .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr auto; }
    nav.genres { display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden; border-right: none; border-bottom: 1px solid var(--line); padding: 8px; }
    .genre { width: auto; white-space: nowrap; margin: 0; padding: 10px 14px; }
    .genre small { display: inline; margin-left: 4px; }
    aside.cart { border-left: none; border-top: 1px solid var(--line); max-height: 46vh; }
    .log { display: none; }
    .hfield input { width: 110px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🧾 販売レジ</h1>
    <button class="hbtn phone-only" id="setBtn">⚙︎ 公演・担当</button>
    <span class="badge" id="envBadge" hidden>テスト版</span>
    <div class="hsets" id="hsets">
    <label class="hfield"><span>公演</span><input id="event" placeholder="例：10/5 大阪 昼" autocomplete="off"></label>
    <label class="hfield"><span>担当</span><input id="operator" placeholder="名前" autocomplete="off"></label>
    <label class="hfield"><span>在庫</span><select id="pool"></select></label>
    </div>
    <div class="spacer"></div>
    <div class="net" id="net">● オンライン</div>
    <button class="hbtn" id="salesBtn">📊 売上を見る</button>
    <button class="hbtn" id="reload">↻ 在庫更新</button>
  </header>
  <div class="main">
    <nav class="genres" id="genres"></nav>
    <section class="items">
      <div class="search"><input id="q" placeholder="🔍 商品名・色で探す" autocomplete="off"></div>
      <div class="grid" id="grid"></div>
    </section>
    <button class="cartbar phone-only" id="cartBar"><span id="barQty">0点</span><span id="barYen"></span><b>お会計へ ›</b></button>
    <aside class="cart" id="cart">
      <h2><button class="phone-only back" id="cartClose">‹ 商品にもどる</button>お会計 <button id="clear">すべて消す</button></h2>
      <div class="lines" id="lines"></div>
      <div class="sum">
        <div class="row"><span>点数</span><b id="sumQty">0点</b></div>
        <div class="row big"><span>合計</span><span id="sumYen">—</span></div>
        <div class="note" id="sumNote"></div>
      </div>
      <div class="change" id="change" hidden>
        <div class="crow"><span>お預かり</span><input id="paidIn" inputmode="numeric" placeholder="円" autocomplete="off"><button id="paidClear">クリア</button></div>
        <div class="cbtns"><button data-paid="exact">ちょうど</button><button data-paid="1000">＋1,000</button><button data-paid="5000">＋5,000</button><button data-paid="10000">＋10,000</button></div>
        <div class="cout" id="changeOut"></div>
      </div>
      <button class="pay" id="pay" disabled>会計する（販売を記録）</button>
      <div class="log"><h3>この端末の記録（今日）</h3><div id="log"></div></div>
    </aside>
  </div>
</div>
<div id="sheet" hidden></div>
<div class="sales" id="sales" hidden>
  <div class="sales-hd">
    <button class="back" id="salesClose">‹ レジにもどる</button>
    <h2>📊 売れたもの</h2>
    <div class="sales-filter">
      <select id="salesWhen"></select>
      <button class="hbtn2" id="salesReload">↻</button>
    </div>
    <div class="seg2" id="salesSeg">
      <button data-v="list" class="on">🕒 会計の順番</button>
      <button data-v="items">📦 商品ごとの個数</button>
    </div>
    <div class="sales-sum" id="salesSum"></div>
  </div>
  <div class="sales-body" id="salesBody"></div>
</div>
<div class="login" id="login" hidden>
  <form id="loginForm">
    <h2>販売レジ</h2>
    <p>管理画面と同じパスワードを入れてください。この端末に保存されます。</p>
    <input id="key" type="password" placeholder="パスワード" autocomplete="current-password">
    <button>はじめる</button>
  </form>
</div>

<script>
(function () {
  'use strict';
  const API_URL = 'https://script.google.com/macros/s/AKfycbxj_wjVq-eC5T_MikXdrMD259UrUAY77VLipvt18RwFByywBXTmV4c5Id03cKw8DeI/exec';
  const ENV = 'test';
  const STORE = 'korokke' + (ENV ? '.' + ENV : '');
  const KEY_STORE = STORE + '.adminKey';     // 管理画面と同じパスワード置き場
  const REG_STORE = STORE + '.register';      // 公演名・担当・在庫区分
  const QUEUE_STORE = STORE + '.registerQueue'; // 未送信の会計
  const LOG_STORE = STORE + '.registerLog';   // この端末の記録

  // 数え方（管理画面・在庫確認ページと同じ）
  const UNIT_MAI = ['Tシャツ', 'ワイシャツ', 'タオル', 'マフラータオル', 'スポーツタオル', 'ハンドタオル', '手ぬぐい',
    'B5クリアファイル', 'クリアファイル', 'ステッカー', 'ストール'];
  const UNIT_HON = ['ペンライト', '傘', 'ストラップ', 'ネックストラップ'];
  const unitOf = t => UNIT_MAI.indexOf(t) >= 0 ? '枚' : UNIT_HON.indexOf(t) >= 0 ? '本' : '個';
  const SIZE_ORDER = ['XS', 'S', 'M', 'L', 'XL', 'XXL', '3XL', '4XL', 'フリー', '-'];

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 保存できなくても動かす */ } };
  const loadKey = () => { try { return localStorage.getItem(KEY_STORE) || ''; } catch (e) { return ''; } };
  const yen = n => n.toLocaleString('ja-JP') + '円';

  const state = { key: loadKey(), products: [], owners: [], genre: '', q: '', cart: {}, bundles: [], sets: [], order: [], paid: '', sending: false };
  const settings = load(REG_STORE, { event: '', operator: '', pool: '' });

  function imageSrc(url, w) {
    const m = String(url || '').match(/\/d\/([\w-]{20,})|[?&]id=([\w-]{20,})/);
    const id = m && (m[1] || m[2]);
    return id ? 'https://lh3.googleusercontent.com/d/' + id + '=w' + w : url;
  }
  const icon = t => /タオル|手ぬぐい|ストール/.test(t) ? '🧣' : /シャツ/.test(t) ? '👕' : /クリア/.test(t) ? '📁' : /キー|ストラップ/.test(t) ? '🔑'
    : /帽/.test(t) ? '🧢' : /ペンライト/.test(t) ? '🔦' : /傘/.test(t) ? '☂️' : /グラス/.test(t) ? '🥃' : /マグネット/.test(t) ? '🧲' : '🎁';

  function toast(msg, err) {
    const t = document.createElement('div');
    t.className = 'toast' + (err ? ' err' : '');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), err ? 4500 : 2200);
  }

  // ---------- サーバー ----------
  async function api(action, params, timeoutMs) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs || 30000);
    try {
      const body = Object.assign({ action: action, key: state.key }, params);
      if (ENV) body.env = ENV;
      const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body), credentials: 'omit', signal: ctrl.signal });
      const res = await r.json();
      if (!res.ok) { const e = new Error(res.error || 'エラー'); e.server = true; throw e; }
      return res.data;
    } finally {
      clearTimeout(timer);
    }
  }

  async function loadProducts(quiet) {
    try {
      const d = await api('getBootData', {}, 20000);
      state.products = d.products.filter(p => !p.discontinued);
      state.owners = d.config.owners || ['現場用'];
      state.sets = d.config.sets || [];
      state.order = d.config.displayOrder || [];
      save(STORE + '.registerProducts', state.products);
      save(STORE + '.registerConfig', { sets: state.sets, order: state.order });
      fillPools();
      render();
      if (!quiet) toast('在庫を最新にしました');
    } catch (e) {
      if (e.server && /パスワード/.test(e.message)) return showLogin();
      const cached = load(STORE + '.registerProducts', null);
      const cc = load(STORE + '.registerConfig', {});
      state.sets = cc.sets || []; state.order = cc.order || [];
      if (cached && !state.products.length) { state.products = cached; state.owners = ['現場用', 'ファンクラブ用', '販売在庫']; fillPools(); render(); }
      toast('在庫を読み込めませんでした（前回の在庫で表示）', true);
    }
  }

  function fillPools() {
    const sel = $('pool');
    sel.innerHTML = state.owners.map(o => '<option>' + esc(o) + '</option>').join('');
    sel.value = state.owners.indexOf(settings.pool) >= 0 ? settings.pool : state.owners[0];
  }

  // ---------- 商品をカード（種類・商品名・色）ごとにまとめる ----------
  function groups() {
    const pool = $('pool').value;
    const q = state.q.trim().normalize('NFKC').toLowerCase();
    const map = {}, list = [];
    state.products.forEach(p => {
      if (state.genre && p.type !== state.genre) return;
      const text = [p.category, p.type, p.color, p.size].join(' ').normalize('NFKC').toLowerCase();
      if (q && text.indexOf(q) < 0) return;
      const k = [p.type, p.category, p.color].join('|');
      let g = map[k];
      if (!g) { g = map[k] = { key: k, type: p.type, category: p.category, color: p.color, items: [], stock: 0, img: '' }; list.push(g); }
      g.items.push(p);
      g.stock += p.stock[pool] || 0;
      if (!g.img && p.imageUrl) g.img = p.imageUrl;
    });
    list.forEach(g => g.items.sort((a, b) => SIZE_ORDER.indexOf(a.size) - SIZE_ORDER.indexOf(b.size)));
    // 在庫があるものを先に、その中は商品名順
    // 管理画面で決めた「売り場の並び順」があればその順。売り切れは後ろへ
    const rank = {};
    state.order.forEach((k, i) => { rank[k] = i; });
    const r = g => { const k = [g.category, g.type, g.color].join('|'); return k in rank ? rank[k] : 1e6; };
    return list.sort((a, b) => (b.stock > 0) - (a.stock > 0) || r(a) - r(b) || a.type.localeCompare(b.type, 'ja') || a.category.localeCompare(b.category, 'ja'));
  }

  // カゴに入っている数（単品＋セットの中身）
  const qtyIn = id => (state.cart[id] || 0) + state.bundles.reduce((n, b) => n + b.ids.filter(x => x === id).length, 0);
  const inCart = ids => ids.reduce((n, id) => n + qtyIn(id), 0);
  const byId = id => state.products.find(p => p.id === id);

  function render() {
    // ジャンル
    const counts = {};
    state.products.forEach(p => { counts[p.type] = (counts[p.type] || 0) + 1; });
    const types = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
    $('genres').innerHTML = ['', ...types].map(t =>
      '<button class="genre' + (state.genre === t ? ' on' : '') + '" data-genre="' + esc(t) + '">' + (t ? esc(t) : 'すべて') +
      '</button>').join('');
    // 商品
    const gs = groups();
    const setTiles = state.q ? [] : state.sets.map((x, i) => ({ x: x, i: i })).filter(o => !state.genre || state.genre === o.x.type);
    $('grid').innerHTML = setTiles.map(o => '<button class="tile settile" data-set="' + o.i + '"><div class="ph">🎁</div><div class="tx"><b>' + esc(o.x.name) +
      '</b><div class="sub">' + esc(o.x.type) + 'から好きな' + o.x.count + unitOf(o.x.type) + '</div><div class="stk">' + yen(o.x.price) + '</div></div></button>').join('') +
      (gs.length ? gs.map(g => {
      const n = inCart(g.items.map(p => p.id));
      const ph = g.img ? '<div class="ph" style="background-image:url(\'' + esc(imageSrc(g.img, 400)) + '\')"></div>' : '<div class="ph">' + icon(g.type) + '</div>';
      const sizes = g.items.length > 1 || (g.items[0].size && g.items[0].size !== '-') ? g.items.map(p => p.size).join('・') : '';
      const stk = g.stock > 0 ? '在庫 ' + g.stock + unitOf(g.type) : '売り切れ';
      return '<button class="tile' + (g.stock > 0 ? '' : ' zero') + '" data-key="' + esc(g.key) + '">' + ph +
        (n ? '<span class="incart">' + n + '</span>' : '') +
        '<div class="tx"><b>' + esc(g.category) + '</b><div class="sub">' + esc([g.type, g.color !== '-' ? g.color : '', sizes].filter(Boolean).join(' / ')) +
        '</div><div class="stk' + (g.stock > 0 && g.stock <= 3 ? ' low' : '') + '">' + stk + '</div></div></button>';
    }).join('') : '<div class="empty">商品が見つかりません</div>');
    renderCart();
  }

  function renderCart() {
    const ids = Object.keys(state.cart).filter(id => state.cart[id] > 0);
    const pool = $('pool').value;
    let qty = 0, total = 0, unpriced = 0;
    const bundleHtml = state.bundles.map((b, i) => {
      qty += b.ids.length; total += b.price;
      return '<div class="line"><div class="th">🎁</div><div><b>' + esc(b.name) + '</b><small>' + b.ids.map(id => { const p = byId(id); return p ? esc([p.category, p.color !== '-' ? p.color : '', p.size !== '-' ? p.size : ''].filter(Boolean).join(' ')) : esc(id); }).join('<br>') +
        '　' + yen(b.price) + '</small></div><div class="qty"><button data-unbundle="' + i + '">✕</button></div></div>';
    }).join('');
    $('lines').innerHTML = (ids.length || state.bundles.length) ? bundleHtml + ids.map(id => {
      const p = byId(id); const n = state.cart[id];
      qty += n;
      if (p.price === '' || p.price == null) unpriced += n; else total += p.price * n;
      const th = p.imageUrl ? '<div class="th" style="background-image:url(\'' + esc(imageSrc(p.imageUrl, 120)) + '\')"></div>' : '<div class="th">' + icon(p.type) + '</div>';
      const desc = [p.type, p.color !== '-' ? p.color : '', p.size !== '-' ? p.size : ''].filter(Boolean).join(' / ');
      const price = p.price === '' || p.price == null ? '' : '　' + yen(p.price * n);
      return '<div class="line">' + th + '<div><b>' + esc(p.category) + '</b><small>' + esc(desc) + '　残り' + (p.stock[pool] || 0) + price + '</small></div>' +
        '<div class="qty"><button data-dec="' + esc(id) + '">−</button><span>' + n + '</span><button data-inc="' + esc(id) + '">＋</button></div></div>';
    }).join('') : '<div class="cart-empty">商品の写真をタップすると<br>ここに入ります</div>';
    state.total = unpriced === qty ? 0 : total;
    $('sumQty').textContent = qty + '点';
    $('barQty').textContent = qty ? '🧾 ' + qty + '点' : '🧾 まだ空です';
    $('barYen').textContent = qty && unpriced < qty ? yen(total) : '';
    $('cartBar').classList.toggle('empty', !qty);
    $('sumYen').textContent = qty ? (unpriced === qty ? '価格未設定' : yen(total)) : '—';
    $('sumNote').textContent = unpriced && unpriced < qty ? '※ 価格未設定の商品が' + unpriced + '点あります（合計に入っていません）'
      : unpriced ? '※ 管理画面で価格を入れると合計金額が出ます' : '';
    $('pay').disabled = !qty || state.sending;
    renderChange();
    renderLog();
  }

  // ---------- お預かり・おつり ----------
  function renderChange() {
    const box = $('change');
    if (!state.total) { box.hidden = true; return; }
    box.hidden = false;
    const paid = Number(String(state.paid).replace(/[^0-9]/g, '')) || 0;
    $('paidIn').value = state.paid;
    $('changeOut').innerHTML = !paid ? '' : paid < state.total ? '<span class="short">あと ' + yen(state.total - paid) + '</span>' : 'おつり <b>' + yen(paid - state.total) + '</b>';
  }

  function add(id, d) {
    const p = byId(id); if (!p) return;
    const pool = $('pool').value;
    const next = (state.cart[id] || 0) + d;
    if (d > 0 && qtyIn(id) + d > (p.stock[pool] || 0)) return toast(p.category + '（' + (p.size !== '-' ? p.size : p.color) + '）は在庫が' + (p.stock[pool] || 0) + unitOf(p.type) + 'です', true);
    if (next <= 0) delete state.cart[id]; else state.cart[id] = next;
    render();
  }

  function openSizes(g) {
    const pool = $('pool').value;
    const ph = g.img ? '<div class="ph" style="background-image:url(\'' + esc(imageSrc(g.img, 300)) + '\')"></div>' : '<div class="ph">' + icon(g.type) + '</div>';
    $('sheet').innerHTML = '<div class="sheet-bg" data-close="1"><div class="sheet"><div class="hd">' + ph +
      '<div><b>' + esc(g.category) + '</b><small>' + esc([g.type, g.color !== '-' ? g.color : ''].filter(Boolean).join(' / ')) + '</small></div></div>' +
      '<div class="sizes">' + g.items.map(p => {
        const s = p.stock[pool] || 0, c = qtyIn(p.id);
        return '<button class="size" data-add="' + esc(p.id) + '"' + (s - c > 0 ? '' : ' disabled') + '><b>' + esc(p.size) + '</b><small>残り ' + (s - c) + '</small>' +
          (c ? '<br><span class="c">カゴ ' + c + '</span>' : '') + '</button>';
      }).join('') + '</div><button class="close" data-close="1">閉じる</button></div></div>';
    $('sheet').hidden = false;
    $('sheet').dataset.key = g.key;
  }

  // ---------- 会計（オフライン時は端末に保存して、つながったら送る） ----------
  function log() { return load(LOG_STORE, []).filter(e => e.at.slice(0, 10) === new Date().toISOString().slice(0, 10)); }

  function renderLog() {
    const q = load(QUEUE_STORE, []);
    const entries = q.map(e => Object.assign({ pending: true }, e)).concat(log().reverse()).slice(0, 30);
    $('log').innerHTML = entries.length ? entries.map(e =>
      '<div class="ent' + (e.pending ? ' pending' : '') + (e.undone ? ' undone' : '') + '"><span><b>' + e.at.slice(11, 16) + '　' + e.qty + '点' +
      (e.amount ? '　' + yen(e.amount) : '') + (e.pending ? '　未送信' : '') + (e.undone ? '　取消済' : '') + '</b>' +
      ((e.items || e.names || []).length ? '<small class="what">' + (e.items || e.names).map(esc).join('<br>') + '</small>' : '') + '</span>' +
      (!e.pending && !e.undone && e.opId ? '<button data-undo="' + esc(e.opId) + '">取り消す</button>' : '') + '</div>').join('')
      : '<div style="color:var(--muted)">まだありません</div>';
    const n = q.length;
    $('net').textContent = !navigator.onLine ? '● オフライン' + (n ? '（未送信 ' + n + '件）' : '') : n ? '● 未送信 ' + n + '件' : '● オンライン';
    $('net').className = 'net' + (!navigator.onLine || n ? ' off' : '');
  }

  // 記録に出す「何を売ったか」（例：コロダス ゴールド S ×2）
  function itemNames(items) {
    return items.map(i => {
      const p = byId(i.id);
      if (!p) return i.id + ' ×' + i.qty;
      return [p.category, p.color !== '-' ? p.color : '', p.size !== '-' ? p.size : ''].filter(Boolean).join(' ') + ' ×' + i.qty;
    });
  }

  async function send(entry) {
    const res = await api('processBatch', { mode: 'sale', location: entry.pool, event: entry.event, operator: entry.operator,
      items: entry.items.map(i => i.unitPrice !== undefined ? { productId: i.id, quantity: i.qty, unitPrice: i.unitPrice } : { productId: i.id, quantity: i.qty }) }, 45000);
    const l = load(LOG_STORE, []);
    l.push({ at: entry.at, qty: res.quantity, amount: res.amount, opId: res.opId, items: entry.names || itemNames(entry.items) });
    save(LOG_STORE, l.slice(-300));
    res.products.forEach(np => { const i = state.products.findIndex(p => p.id === np.id); if (i >= 0) state.products[i] = Object.assign(state.products[i], np); });
    return res;
  }

  async function pay() {
    const items = Object.keys(state.cart).filter(id => state.cart[id] > 0).map(id => ({ id: id, qty: state.cart[id] }));
    // セットは値段を中身に割り振る（割り切れない分は1つ目に足す）
    const names = itemNames(items);
    state.bundles.forEach(b => {
      const each = Math.floor(b.price / b.ids.length);
      b.ids.forEach((id, k) => items.push({ id: id, qty: 1, unitPrice: each + (k === 0 ? b.price - each * b.ids.length : 0) }));
      names.unshift('🎁 ' + b.name + '（' + itemNames(b.ids.map(id => ({ id: id, qty: 1 }))).map(n => n.replace(/ ×1$/, '')).join('・') + '）');
    });
    if (!items.length) return;
    const entry = { at: new Date(Date.now() + 9 * 3600e3).toISOString().replace('Z', ''), pool: $('pool').value, event: $('event').value.trim(),
      operator: $('operator').value.trim(), items: items, qty: items.reduce((n, i) => n + i.qty, 0), names: names };
    state.sending = true; renderCart();
    if (!navigator.onLine) {
      queue(entry, '電波がないので端末に保存しました。つながったら自動で送ります');
    } else {
      try {
        const res = await send(entry);
        state.cart = {}; state.bundles = []; state.paid = '';
        $('cart').classList.remove('open');
        toast('✅ ' + res.quantity + '点の販売を記録しました' + (res.amount ? '（' + yen(res.amount) + '）' : ''));
      } catch (e) {
        if (e.server) { toast(e.message, true); }
        else if (e.name === 'AbortError') { toast('通信が途中で切れました。下の記録と在庫を確認してからやり直してください', true); }
        else { queue(entry, '送れなかったので端末に保存しました。つながったら自動で送ります'); }
      }
    }
    state.sending = false; render();
  }

  function queue(entry, msg) {
    entry.names = entry.names || itemNames(entry.items);
    const q = load(QUEUE_STORE, []); q.push(entry); save(QUEUE_STORE, q);
    // 在庫の表示だけ先に減らしておく
    entry.items.forEach(i => { const p = byId(i.id); if (p) p.stock[entry.pool] = Math.max(0, (p.stock[entry.pool] || 0) - i.qty); });
    state.cart = {}; state.bundles = []; state.paid = '';
    toast(msg);
  }

  async function flush() {
    if (!navigator.onLine || state.flushing) return;
    let q = load(QUEUE_STORE, []);
    if (!q.length) return;
    state.flushing = true;
    try {
      while (q.length) {
        try { await send(q[0]); } catch (e) { if (!e.server) break; toast('未送信の会計を送れませんでした：' + e.message, true); }
        q = load(QUEUE_STORE, []); q.shift(); save(QUEUE_STORE, q);
      }
      if (!q.length) { toast('未送信の会計をすべて送りました'); loadProducts(true); }
    } finally { state.flushing = false; renderLog(); }
  }

  async function undo(opId) {
    // 押し間違い防止：1回目は確認表示だけ
    const btn = document.querySelector('[data-undo="' + opId + '"]');
    if (btn && !btn.dataset.armed) { btn.dataset.armed = '1'; btn.textContent = 'もう一度押すと取消'; setTimeout(() => { delete btn.dataset.armed; btn.textContent = '取り消す'; }, 4000); return; }
    try {
      await api('undoOperation', { opId: opId, operator: $('operator').value.trim() });
      const l = load(LOG_STORE, []); l.forEach(e => { if (e.opId === opId) e.undone = true; }); save(LOG_STORE, l);
      toast('取り消しました'); loadProducts(true);
    } catch (e) { toast(e.message, true); }
  }

  // ---------- 操作 ----------
  document.addEventListener('click', e => {
    const t = e.target.closest('button, .sheet-bg');
    if (!t) return;
    if (t.dataset.genre !== undefined) { state.genre = t.dataset.genre; render(); $('grid').parentElement.scrollTop = 0; return; }
    if (t.dataset.set !== undefined) return openSet(+t.dataset.set);
    if (t.dataset.pick) return pickForSet(t.dataset.pick);
    if (t.dataset.setDone) return finishSet();
    if (t.dataset.unbundle !== undefined) { state.bundles.splice(+t.dataset.unbundle, 1); return render(); }
    if (t.dataset.paid !== undefined) { state.paid = t.dataset.paid === 'exact' ? String(state.total) : String((Number(state.paid) || 0) + Number(t.dataset.paid)); return renderChange(); }
    if (t.classList.contains('tile')) {
      const g = groups().find(x => x.key === t.dataset.key); if (!g) return;
      if (g.items.length === 1) add(g.items[0].id, 1); else openSizes(g);
      return;
    }
    if (t.dataset.add) { add(t.dataset.add, 1); const g = groups().find(x => x.key === $('sheet').dataset.key); if (g) openSizes(g); return; }
    if (t.dataset.close && (e.target === t || t.tagName === 'BUTTON')) { $('sheet').hidden = true; return; }
    if (t.dataset.inc) return add(t.dataset.inc, 1);
    if (t.dataset.dec) return add(t.dataset.dec, -1);
    if (t.dataset.undo) return undo(t.dataset.undo);
  });
  $('q').addEventListener('input', e => { state.q = e.target.value; render(); });
  $('clear').addEventListener('click', () => { state.cart = {}; state.bundles = []; state.paid = ''; render(); });
  $('paidIn').addEventListener('input', e => { state.paid = e.target.value; renderChange(); });
  $('paidClear').addEventListener('click', () => { state.paid = ''; renderChange(); });

  // ---------- セット販売（例：クリアファイル好きな2枚で500円） ----------
  function openSet(i) {
    const x = state.sets[i];
    state.picking = { set: x, ids: [] };
    drawSet();
  }
  function drawSet() {
    const { set, ids } = state.picking;
    const pool = $('pool').value;
    const list = state.products.filter(p => p.type === set.type);
    $('sheet').innerHTML = '<div class="sheet-bg" data-close="1"><div class="sheet"><div class="hd"><div class="ph">🎁</div><div><b>' + esc(set.name) + '　' + yen(set.price) +
      '</b><small>好きな' + set.count + unitOf(set.type) + 'を選んでください（' + ids.length + ' / ' + set.count + '）</small></div></div>' +
      '<div class="sizes setpick">' + list.map(p => {
        const left = (p.stock[pool] || 0) - qtyIn(p.id) - ids.filter(x => x === p.id).length;
        const c = ids.filter(x => x === p.id).length;
        const ph = p.imageUrl ? '<span class="sph" style="background-image:url(\'' + esc(imageSrc(p.imageUrl, 200)) + '\')"></span>' : '';
        return '<button class="size" data-pick="' + esc(p.id) + '"' + (left > 0 && ids.length < set.count ? '' : ' disabled') + '>' + ph + '<b class="sn">' + esc(p.category) + '</b><small>' +
          esc([p.color !== '-' ? p.color : '', p.size !== '-' ? p.size : ''].filter(Boolean).join(' ')) + '　残り ' + Math.max(0, left) + '</small>' + (c ? '<br><span class="c">選択 ' + c + '</span>' : '') + '</button>';
      }).join('') + '</div><div class="setbtns"><button class="close" data-close="1">やめる</button>' +
      '<button class="close ok" data-set-done="1"' + (ids.length === set.count ? '' : ' disabled') + '>カゴに入れる</button></div></div></div>';
    $('sheet').hidden = false;
    $('sheet').dataset.key = '';
  }
  function pickForSet(id) {
    if (!state.picking) return;
    if (state.picking.ids.length < state.picking.set.count) state.picking.ids.push(id);
    drawSet();
  }
  function finishSet() {
    const { set, ids } = state.picking;
    if (ids.length !== set.count) return;
    state.bundles.push({ name: set.name, price: set.price, ids: ids.slice() });
    state.picking = null;
    $('sheet').hidden = true;
    render();
  }
  $('pay').addEventListener('click', pay);

  // ---------- 売れたもの（全端末の記録をサーバーから読む） ----------
  const salesState = { view: 'list', data: null };
  function today() { return new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10); }
  function fillWhen(events) {
    const sel = $('salesWhen'), cur = sel.value;
    const days = [0, 1, 2, 3, 4, 5, 6].map(d => new Date(Date.now() + 9 * 3600e3 - d * 864e5).toISOString().slice(0, 10));
    sel.innerHTML = days.map((d, i) => '<option value="d:' + d + '">' + (i === 0 ? '今日' : i === 1 ? '昨日' : '') + '（' + d.slice(5).replace('-', '/') + '）</option>').join('') +
      (events || []).map(e => '<option value="e:' + esc(e) + '">公演：' + esc(e) + '（全日）</option>').join('');
    if (cur && [...sel.options].some(o => o.value === cur)) sel.value = cur;
  }
  async function loadSales() {
    const v = $('salesWhen').value || 'd:' + today();
    $('salesBody').innerHTML = '<div class="empty">読み込み中…</div>';
    try {
      const d = await api('getSales', v[0] === 'e' ? { event: v.slice(2) } : { date: v.slice(2) }, 30000);
      salesState.data = d;
      fillWhen(d.events);
      renderSales();
    } catch (e) {
      $('salesBody').innerHTML = '<div class="empty">読み込めませんでした（' + esc(e.message) + '）</div>';
    }
  }
  function renderSales() {
    const sales = (salesState.data && salesState.data.sales) || [];
    const live = sales.filter(x => !x.undone);
    const qty = live.reduce((n, x) => n + x.qty, 0), amt = live.reduce((n, x) => n + x.amount, 0);
    $('salesSum').innerHTML = '<span><b>' + live.length + '</b>会計</span><span><b>' + qty + '</b>点</span>' + (amt ? '<span><b>' + yen(amt) + '</b></span>' : '');
    document.querySelectorAll('#salesSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === salesState.view));
    if (!sales.length) { $('salesBody').innerHTML = '<div class="empty">この日の販売はまだありません</div>'; return; }
    const label = i => [i.category, i.color !== '-' ? i.color : '', i.size !== '-' ? i.size : ''].filter(Boolean).join(' ');
    const shime = (salesState.data && !salesState.data.event) ? '<div class="shime"><b>🧮 締め（精算チェック）</b><div class="shrow">記録の合計 <b>' + (amt ? yen(amt) : '価格未設定') + '</b>' +
      '<label>実際の金額（レシート・現金） <input id="realYen" inputmode="numeric" placeholder="円" value="' + esc(salesState.real || '') + '"></label><span id="shimeDiff"></span></div></div>' : '';
    if (salesState.view === 'list') {
      $('salesBody').innerHTML = shime + sales.map((x, k) => '<div class="sale' + (x.undone ? ' undone' : '') + '"><div class="top"><b>' + esc(x.at.slice(6)) + '</b>' +
        '<span>' + x.qty + '点' + (x.operator ? '・' + esc(x.operator) : '') + (x.undone ? '・取消済' : '') + '</span>' +
        '<span class="amt">' + (x.amount ? yen(x.amount) : '') + '</span></div><ul>' +
        x.items.map(i => '<li>' + esc(label(i)) + ' <span>' + esc(i.type) + '</span>　×' + i.qty + '</li>').join('') + '</ul></div>').join('');
      shimeDiff();
      return;
    }
    // 商品ごと（ジャンル別にまとめて多い順）
    const byKey = {}, list = [];
    live.forEach(x => x.items.forEach(i => {
      const k = i.id;
      if (!byKey[k]) { byKey[k] = Object.assign({ n: 0 }, i); list.push(byKey[k]); }
      byKey[k].n += i.qty;
    }));
    const types = {};
    list.forEach(i => { (types[i.type] = types[i.type] || []).push(i); });
    const order = Object.keys(types).sort((a, b) => types[b].reduce((n, i) => n + i.n, 0) - types[a].reduce((n, i) => n + i.n, 0));
    $('salesBody').innerHTML = shime + '<div class="rank">' + order.map(t => {
      const items = types[t].sort((a, b) => b.n - a.n);
      return '<div class="gh">' + esc(t) + '　計 ' + items.reduce((n, i) => n + i.n, 0) + unitOf(t) + '</div>' +
        items.map((i, k) => '<div class="r"><span class="no">' + (k + 1) + '</span><span>' + esc(i.category) +
          '<small>' + esc([i.color !== '-' ? i.color : '', i.size !== '-' ? i.size : ''].filter(Boolean).join(' / ')) + '</small></span>' +
          '<span class="n">' + i.n + '<small>' + unitOf(i.type) + '</small></span></div>').join('');
    }).join('') + '</div>';
    shimeDiff();
  }
  $('salesBtn').addEventListener('click', () => { $('sales').hidden = false; if (!$('salesWhen').options.length) fillWhen([]); loadSales(); });
  $('salesClose').addEventListener('click', () => { $('sales').hidden = true; });
  $('salesWhen').addEventListener('change', loadSales);
  $('salesReload').addEventListener('click', loadSales);
  function shimeDiff() {
    const el = $('shimeDiff'); if (!el) return;
    const live = ((salesState.data && salesState.data.sales) || []).filter(x => !x.undone);
    const amt = live.reduce((n, x) => n + x.amount, 0);
    const real = Number(String(salesState.real || '').replace(/[^0-9]/g, ''));
    el.innerHTML = !salesState.real ? '' : real === amt ? '<span class="ok">✅ ぴったりです</span>' : '<span class="ng">差額 ' + (real > amt ? '＋' : '−') + yen(Math.abs(real - amt)) + (real > amt ? '（多い）' : '（足りない）') + '</span>';
  }
  $('salesBody').addEventListener('input', e => { if (e.target.id === 'realYen') { salesState.real = e.target.value; shimeDiff(); } });
  $('salesSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; salesState.view = b.dataset.v; renderSales(); });
  $('setBtn').addEventListener('click', () => $('hsets').classList.toggle('open'));
  $('cartBar').addEventListener('click', () => $('cart').classList.add('open'));
  $('cartClose').addEventListener('click', () => $('cart').classList.remove('open'));
  $('reload').addEventListener('click', () => loadProducts());
  ['event', 'operator', 'pool'].forEach(id => {
    $(id).value = settings[id] || $(id).value;
    $(id).addEventListener('change', () => { settings[id] = $(id).value; save(REG_STORE, settings); if (id === 'pool') { state.cart = {}; render(); } });
  });
  window.addEventListener('online', () => { renderLog(); flush(); });
  window.addEventListener('offline', renderLog);
  setInterval(flush, 20000);

  function showLogin() { $('login').hidden = false; $('key').focus(); }
  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    state.key = $('key').value.trim();
    try { await api('checkKey', {}, 15000); try { localStorage.setItem(KEY_STORE, state.key); } catch (err) { /* */ } $('login').hidden = true; loadProducts(true); }
    catch (err) { toast('パスワードが違います', true); }
  });

  if (ENV) $('envBadge').hidden = false;
  if (!state.key) showLogin(); else { loadProducts(true); flush(); }
  renderLog();
})();
</script>
</body>
</html>
