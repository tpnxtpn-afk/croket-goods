<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#121418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="テストレジ">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest-register.webmanifest">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" type="image/png" href="../icon-192.png">
<title>【テスト】販売レジ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&family=BIZ+UDPGothic:wght@400;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
  /* 劇場の物販ブース：ジャンルは虹の7色の見出しタブ、在庫はハンガーの札、カゴはレシート */
  :root {
    --ground: #e9ecf0; --panel: #fff; --ink: #14171d; --sub: #5d6571; --rule: #d0d5dc; --hatch: #c9ced6;
    --low: #d97a00; --low-soft: #fff1dc; --out: #9aa2ad; --bad: #d23a2f; --good: #1d8a52;
    --g-t: #e0352b; --g-towel: #ef7a14; --g-file: #d9a400; --g-knit: #23945a; --g-key: #1d74d0; --g-goods: #6a4fd0; --g-mag: #b0409a;
    --display: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
    --body: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    --num: "Barlow Condensed", "DIN Condensed", "Arial Narrow", sans-serif;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { font-family: var(--body); background: var(--ground); color: var(--ink);
    -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
  button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; padding: 0; }
  input, select { font: inherit; }
  .n { font-family: var(--num); font-weight: 700; font-variant-numeric: tabular-nums; }

  /* ---------- 骨組み（横向きiPad：ジャンル｜商品｜レシート） ---------- */
  .app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; padding-top: calc(10px + env(safe-area-inset-top, 0px));
    background: var(--ink); color: #fff; }
  header h1 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 21px; white-space: nowrap; }
  header .badge { white-space: nowrap; flex: none; background: var(--bad); color: #fff; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
  .hfield { display: flex; align-items: center; gap: 6px; border: 1px solid rgba(255,255,255,.22); border-radius: 10px; padding: 6px 10px; }
  .hfield span { font-size: 12px; opacity: .7; white-space: nowrap; }
  .hfield input, .hfield select { background: transparent; border: none; color: #fff; font-size: 16px; width: 150px; min-width: 0; outline: none; }
  .hfield input::placeholder { color: rgba(255,255,255,.45); }
  @media (max-width: 1250px) { .hfield input, .hfield select { width: 118px; } .net { font-size: 12px; } }
  .hfield select option { color: #000; }
  .spacer { flex: 1; }
  .net { font-size: 13px; padding: 6px 10px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .net::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #3ccf7f; }
  .net.off { color: #ffd2cc; }
  .net.off::before { background: #ff6b5e; }
  .hbtn { border: 1px solid rgba(255,255,255,.35); color: #fff; border-radius: 10px; padding: 8px 12px; font-size: 15px; font-weight: 700; white-space: nowrap; }
  .hbtn:active { background: rgba(255,255,255,.15); }

  .main { display: grid; grid-template-columns: 186px minmax(0, 1fr) 340px; min-height: 0; }

  /* ジャンル：色の札 */
  nav.genres { overflow-y: auto; padding: 12px 0 12px 10px; background: var(--panel); border-right: 1px solid var(--rule); }
  .genre { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 12px 10px; margin-bottom: 4px; border-radius: 10px 0 0 10px;
    font-size: 15px; font-weight: 700; color: var(--ink); word-break: keep-all; overflow-wrap: anywhere; line-height: 1.3; }
  .genre i { width: 12px; height: 12px; border-radius: 3px; background: var(--gc, var(--ink)); flex: none; }
  .genre.on { background: var(--gc, var(--ink)); color: #fff; margin-right: -1px; }
  .genre.on i { background: #fff; }
  .genre small { display: none; }

  section.items { overflow-y: auto; padding: 14px; min-height: 0; }
  .search { display: flex; gap: 10px; margin-bottom: 16px; }
  .search input { flex: 1; font-size: 17px; padding: 11px 18px; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--panel); outline: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 24px 12px; align-content: start; }

  /* 商品の札：上に色の見出しタブ、写真、名前、サイズのハンガー */
  .tile { position: relative; display: flex; flex-direction: column; min-width: 0; text-align: left; }
  .gtab { align-self: flex-start; background: var(--gc, var(--ink)); color: #fff; font-weight: 700; font-size: 12px; padding: 3px 10px; border-radius: 7px 7px 0 0; line-height: 1.4; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .tcard { border: 1.5px solid var(--ink); border-radius: 0 10px 10px 10px; overflow: hidden; background: var(--panel); display: flex; flex-direction: column; flex: 1; }
  .tpic { display: block; width: 100%; text-align: left; position: relative; }
  .tpic:active { opacity: .85; }
  .tile .ph { aspect-ratio: 1 / 1; background: #eef0f3 center/cover no-repeat; display: grid; place-items: center; width: 100%; }
  .ph.txt { background: color-mix(in srgb, var(--gc, var(--ink)) 13%, #fff); color: color-mix(in srgb, var(--gc, var(--ink)) 82%, #000);
    font-family: var(--display); font-weight: 900; font-size: 22px; line-height: 1.2; padding: 10px; text-align: center; word-break: keep-all; overflow-wrap: anywhere; }
  .tile .tx { padding: 8px 10px 4px; border-top: 1.5px solid var(--ink); }
  .tile b { display: block; font-size: 17px; line-height: 1.25; word-break: keep-all; overflow-wrap: anywhere; }
  .tile .sub { font-size: 13px; color: var(--sub); margin-top: 2px; word-break: keep-all; overflow-wrap: anywhere; }
  .tile .incart { position: absolute; top: 8px; right: 8px; min-width: 36px; height: 36px; border-radius: 18px; padding: 0 9px;
    background: var(--ink); color: #fff; font-family: var(--num); font-weight: 700; font-size: 22px; display: grid; place-items: center; box-shadow: 0 0 0 3px #fff; }
  .tile.zero .tpic { filter: grayscale(1); opacity: .5; }
  .empty { text-align: center; color: var(--sub); padding: 60px 0; font-size: 17px; grid-column: 1 / -1; }

  /* サイズのハンガー札（押すとそのままカゴへ） */
  .rack { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 5px; padding: 12px 10px 10px; }
  .rack.wide { grid-template-columns: minmax(0, 1fr); }
  .tag { position: relative; border: 1.5px solid var(--ink); border-radius: 7px; padding: 3px 0 4px; text-align: center; background: var(--panel); min-width: 0; }
  .tag::before { content: ""; position: absolute; left: 50%; top: -8px; width: 11px; height: 7px; border: 1.5px solid var(--ink); border-bottom: none; border-radius: 7px 7px 0 0; transform: translateX(-50%); background: var(--panel); }
  .tag i { display: block; font-style: normal; font-size: 11px; font-weight: 700; line-height: 1.2; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag b { display: block; font-family: var(--num); font-weight: 700; font-size: 23px; line-height: 1; font-variant-numeric: tabular-nums; }
  .rack.wide .tag { display: flex; align-items: baseline; justify-content: center; gap: 6px; padding: 6px 0; }
  .rack.wide .tag i { display: inline; font-size: 13px; }
  .tag.low { border-color: var(--low); background: var(--low-soft); }
  .tag.low::before { border-color: var(--low); background: var(--low-soft); }
  .tag.low b { color: var(--low); }
  .tag.out, .tag:disabled { border-color: var(--hatch); background: repeating-linear-gradient(-45deg, transparent 0 4px, var(--hatch) 4px 5px); cursor: default; }
  .tag.out::before, .tag:disabled::before { border-color: var(--hatch); background: var(--panel); }
  .tag.out b, .tag.out i, .tag:disabled b, .tag:disabled i { color: var(--out); }
  .tag.out b { text-decoration: line-through; text-decoration-thickness: 2px; }
  button.tag:not(:disabled):active { background: var(--ink); color: #fff; }
  button.tag:not(:disabled):active b, button.tag:not(:disabled):active i { color: #fff; }
  .tag .c { position: absolute; top: -10px; right: -6px; background: var(--ink); color: #fff; font-family: var(--num); font-weight: 700; font-size: 14px; min-width: 20px; height: 20px; line-height: 20px; border-radius: 10px; padding: 0 5px; z-index: 1; }
  .settile .tcard { border-style: dashed; }
  .settile .price { padding: 6px 10px 12px; font-family: var(--num); font-weight: 700; font-size: 26px; }

  /* ---------- レシート（カゴ） ---------- */
  aside.cart { display: flex; flex-direction: column; background: var(--ground); border-left: 1px solid var(--rule); min-height: 0; padding: 14px 14px 0; }
  .receipt { background: var(--panel); display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; padding-bottom: 14px;
    -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 14px 100%;
    mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 14px 100%; }
  .cart h2 { margin: 0; padding: 14px 14px 8px; font-family: var(--display); font-weight: 900; font-size: 19px; letter-spacing: .14em; display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 1.5px dashed var(--rule); }
  .cart h2 button { font-family: var(--body); letter-spacing: 0; font-size: 13px; font-weight: 700; color: var(--sub); }
  .lines { flex: 1; overflow-y: auto; padding: 0 12px; min-height: 60px; }
  .line { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px dotted var(--rule); }
  .line .th { width: 44px; height: 44px; border-radius: 6px; background: #eef0f3 center/cover; }
  .line .th.txt { display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 10px; line-height: 1.1; text-align: center; padding: 2px;
    background: color-mix(in srgb, var(--gc, var(--ink)) 13%, #fff); color: color-mix(in srgb, var(--gc, var(--ink)) 82%, #000); overflow: hidden; }
  .line b { display: block; font-size: 15px; }
  .line small { color: var(--sub); font-size: 12px; word-break: keep-all; overflow-wrap: anywhere; }
  .qty { display: flex; align-items: center; gap: 2px; }
  .qty button { width: 40px; height: 40px; border-radius: 10px; border: 1.5px solid var(--ink); font-size: 22px; font-weight: 700; line-height: 1; }
  .qty button:active { background: var(--ink); color: #fff; }
  .qty span { min-width: 30px; text-align: center; font-family: var(--num); font-size: 24px; font-weight: 700; }
  .cart-empty { color: var(--sub); text-align: center; padding: 34px 10px; line-height: 1.8; font-size: 14px; }
  .sum { padding: 10px 14px 0; border-top: 2px solid var(--ink); margin: 0 12px; padding-inline: 0; }
  .sum .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 15px; margin: 2px 0; }
  .sum .row b { font-family: var(--num); font-size: 20px; }
  .sum .row.big { font-weight: 700; }
  .sum .row.big #sumYen { font-family: var(--num); font-weight: 700; font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; }
  .sum .note { font-size: 12px; color: var(--sub); }
  .pay { margin: 12px 0 calc(12px + var(--safe-b)); padding: 17px; border-radius: 12px; background: var(--ink); color: #fff;
    font-family: var(--display); font-weight: 900; font-size: 21px; letter-spacing: .06em; flex: none; }
  .pay:active { transform: translateY(1px); }
  .pay:disabled { opacity: .3; }
  .log { border-top: 1px solid var(--rule); max-height: 30%; overflow-y: auto; padding: 8px 2px 10px; font-size: 13px; flex: none; }
  .log h3 { margin: 4px 0 6px; font-size: 13px; color: var(--sub); }
  .log .ent { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1px dashed var(--rule); align-items: flex-start; }
  .log .ent.pending { color: var(--low); }
  .log .ent.undone { color: var(--out); text-decoration: line-through; }
  .log .ent span { min-width: 0; }
  .log .ent .what { display: block; color: var(--ink); font-size: 12px; line-height: 1.5; margin-top: 2px; }
  .log .ent.undone .what { color: var(--out); }
  .log .ent button { color: var(--bad); font-size: 13px; font-weight: 700; white-space: nowrap; }

  /* ---------- サイズを選ぶ画面 ---------- */
  .sheet-bg { position: fixed; inset: 0; background: rgba(15,18,24,.5); display: grid; place-items: center; z-index: 20; }
  .sheet { background: var(--panel); border-radius: 18px; width: min(640px, 92vw); max-height: 88vh; overflow: auto; padding: 22px; border: 2px solid var(--ink); }
  .sheet .hd { display: flex; gap: 16px; align-items: center; margin-bottom: 20px; }
  .sheet .hd .ph { width: 92px; height: 92px; border-radius: 10px; background: #eef0f3 center/cover; flex: none; }
  .sheet .hd .ph.txt { font-size: 14px; }
  .sheet .hd b { font-family: var(--display); font-weight: 900; font-size: 23px; display: block; line-height: 1.25; }
  .sheet .hd small { color: var(--sub); font-size: 15px; }
  .sizes { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 18px 12px; }
  .sizes .tag { padding: 10px 0 12px; border-radius: 12px; border-width: 2px; }
  .sizes .tag::before { top: -10px; width: 16px; height: 9px; border-width: 2px; }
  .sizes .tag i { font-size: 15px; }
  .sizes .tag b { font-size: 34px; }
  .sizes .tag .c { font-size: 16px; height: 24px; line-height: 24px; min-width: 24px; border-radius: 12px; top: -12px; }
  .sheet .close { margin-top: 20px; width: 100%; padding: 14px; border-radius: 12px; border: 1.5px solid var(--ink); font-size: 17px; font-weight: 700; }

  /* ---------- おつり・セット・締め ---------- */
  .change { padding: 8px 0 2px; margin: 0 12px; border-top: 1px dashed var(--rule); flex: none; }
  .change .crow { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .change .crow input { flex: 1; min-width: 0; font-family: var(--num); font-weight: 700; font-size: 24px; padding: 4px 10px; border: 1.5px solid var(--ink); border-radius: 8px; text-align: right; }
  .change .crow button { font-size: 13px; color: var(--sub); }
  .change .cbtns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 6px; }
  .change .cbtns button { white-space: nowrap; letter-spacing: -.02em; padding: 7px 0; border-radius: 8px; border: 1px solid var(--rule); font-size: 13px; font-weight: 700; }
  .change .cbtns button:active { background: var(--ink); color: #fff; }
  .change .cout { min-height: 30px; text-align: right; font-size: 15px; margin-top: 4px; }
  .change .cout b { font-family: var(--num); font-size: 30px; color: var(--good); }
  .change .cout .short { color: var(--bad); font-weight: 700; }
  .setpick .size { display: grid; justify-items: center; gap: 2px; padding: 8px; border: 1.5px solid var(--ink); border-radius: 12px; text-align: center; }
  .setpick .size:disabled { opacity: .35; }
  .setpick .size small { font-size: 12px; color: var(--sub); }
  .setpick .size .c { display: inline-block; margin-top: 2px; background: var(--ink); color: #fff; border-radius: 10px; padding: 0 8px; font-weight: 700; font-size: 13px; }
  .setpick .sph { width: 72px; height: 72px; border-radius: 8px; background: #eef0f3 center/cover; }
  .setpick .sn { font-size: 15px !important; }
  .setbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .setbtns .ok { background: var(--ink); color: #fff; }
  .setbtns .ok:disabled { opacity: .3; }
  .shime { background: var(--panel); border: 2px solid var(--ink); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
  .shime .shrow { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-top: 6px; font-size: 15px; }
  .shime input { width: 150px; font-family: var(--num); font-weight: 700; font-size: 22px; padding: 4px 10px; border: 1.5px solid var(--ink); border-radius: 8px; text-align: right; }
  .shime .ok { color: var(--good); font-weight: 700; }
  .shime .ng { color: var(--bad); font-weight: 700; }

  /* ---------- 売れたもの ---------- */
  .sales { position: fixed; inset: 0; z-index: 30; background: var(--ground); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
  .sales-hd { background: var(--panel); padding: 12px 16px; border-bottom: 1.5px solid var(--ink); display: grid; gap: 10px; }
  .sales-hd h2 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 22px; }
  .sales-hd .back { justify-self: start; font-weight: 700; font-size: 15px; }
  .sales-filter { display: flex; gap: 8px; }
  .sales-filter select { flex: 1; font-size: 16px; padding: 9px 10px; border-radius: 10px; border: 1.5px solid var(--ink); background: var(--panel); }
  .hbtn2 { padding: 0 16px; border-radius: 10px; border: 1.5px solid var(--ink); font-size: 14px; font-weight: 700; }
  .seg2 { display: grid; grid-template-columns: 1fr 1fr; border: 1.5px solid var(--ink); border-radius: 10px; overflow: hidden; }
  .seg2 button { padding: 10px; font-size: 15px; font-weight: 700; color: var(--sub); }
  .seg2 button.on { background: var(--ink); color: #fff; }
  .sales-sum { display: flex; gap: 20px; font-size: 14px; color: var(--sub); align-items: baseline; }
  .sales-sum { flex-wrap: wrap; }
  .sales-sum .localnote { flex-basis: 100%; color: var(--low); font-size: 13px; font-weight: 700; }
  .sales-sum b { color: var(--ink); font-family: var(--num); font-size: 28px; margin-right: 3px; }
  .sales-body { flex: 1; overflow-y: auto; padding: 14px 16px calc(20px + var(--safe-b)); }
  .sale { background: var(--panel); border-left: 4px solid var(--ink); padding: 10px 14px; margin-bottom: 8px; }
  .sale .top { display: flex; gap: 10px; align-items: baseline; font-size: 14px; color: var(--sub); }
  .sale .top b { color: var(--ink); font-family: var(--num); font-size: 22px; }
  .sale .top .amt { margin-left: auto; color: var(--ink); font-family: var(--num); font-weight: 700; font-size: 20px; }
  .sale ul { margin: 4px 0 0; padding: 0; list-style: none; font-size: 15px; line-height: 1.7; }
  .sale ul li span { color: var(--sub); }
  .sale.undone { opacity: .5; border-left-color: var(--out); }
  .sale.undone ul { text-decoration: line-through; }
  .rank { background: var(--panel); }
  .rank .r { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--rule); font-size: 16px; }
  .rank .r .no { color: var(--sub); font-family: var(--num); font-weight: 700; font-size: 18px; text-align: center; }
  .rank .r small { display: block; color: var(--sub); font-size: 13px; }
  .rank .r .n { font-family: var(--num); font-size: 28px; font-weight: 700; }
  .rank .r .n small { display: inline; font-family: var(--body); font-size: 13px; font-weight: 400; margin-left: 2px; }
  .rank .gh { padding: 6px 14px; background: var(--gc, var(--ink)); color: #fff; font-weight: 700; font-size: 14px; }
  @media (min-width: 900px) { .sales-hd { grid-template-columns: auto 1fr auto; align-items: center; } .sales-hd .seg2, .sales-hd .sales-sum { grid-column: 1 / -1; } }

  /* ---------- お知らせ・ログイン ---------- */
  .toast { position: fixed; left: 50%; bottom: calc(26px + var(--safe-b)); transform: translateX(-50%); background: var(--ink); color: #fff;
    padding: 14px 22px; border-radius: 12px; font-size: 16px; font-weight: 700; z-index: 40; box-shadow: 0 10px 28px rgba(0,0,0,.3); max-width: 90vw; }
  .toast.err { background: var(--bad); }
  .login { position: fixed; inset: 0; background: var(--ground); display: grid; place-items: center; z-index: 50; padding: 16px; }
  .login form { background: var(--panel); padding: 28px; border-radius: 16px; width: min(420px, 100%); border: 2px solid var(--ink); }
  .login h2 { margin: 0 0 6px; font-family: var(--display); font-weight: 900; }
  .login p { color: var(--sub); margin: 0 0 16px; font-size: 14px; }
  .login input { width: 100%; font-size: 18px; padding: 12px; border: 1.5px solid var(--ink); border-radius: 10px; margin-bottom: 12px; }
  .login button { width: 100%; padding: 14px; border-radius: 10px; background: var(--ink); color: #fff; font-size: 18px; font-weight: 700; }

  .hsets { display: contents; }
  .phone-only { display: none !important; }

  /* ---------- iPhone（幅600px以下）：札2列、レシートは下のバーから開く ---------- */
  @media (max-width: 600px) {
    .phone-only { display: inline-flex !important; }
    header { flex-wrap: wrap; gap: 8px; padding: 8px 12px; padding-top: calc(8px + env(safe-area-inset-top, 0px)); }
    header h1 { font-size: 18px; }
    header .spacer, #reload { display: none; }
    #salesBtn { font-size: 13px; padding: 6px 10px; }
    .net { font-size: 11px; margin-left: auto; padding: 4px 4px; }
    .hsets { display: none; width: 100%; flex-direction: column; gap: 6px; }
    .hsets.open { display: flex; }
    .hfield input, .hfield select { width: 100%; flex: 1; }
    .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
    nav.genres { display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; border-right: none; border-bottom: 1px solid var(--rule); padding: 8px 10px; }
    .genre { width: auto; white-space: nowrap; margin: 0; padding: 7px 12px; font-size: 14px; border-radius: 999px; border: 1.5px solid var(--gc, var(--ink)); }
    .genre.on { margin: 0; }
    section.items { padding: 10px 10px calc(84px + var(--safe-b)); }
    .search input { font-size: 16px; padding: 9px 14px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 8px; }
    .tile b { font-size: 15px; }
    .tile .sub { font-size: 12px; }
    .rack { gap: 11px 3px; padding: 11px 6px 8px; }
    .tag b { font-size: 19px; }
    .tag i { font-size: 10px; }
    .ph.txt { font-size: 17px; }
    .cartbar { position: fixed; left: 10px; right: 10px; bottom: calc(10px + var(--safe-b)); z-index: 15; align-items: center; gap: 12px;
      padding: 13px 18px; border-radius: 12px; background: var(--ink); color: #fff; font-size: 16px; font-weight: 700; box-shadow: 0 8px 22px rgba(0,0,0,.3); }
    .cartbar #barYen { font-family: var(--num); font-size: 22px; }
    .cartbar b { margin-left: auto; font-size: 16px; }
    .cartbar.empty { background: #7b838f; }
    aside.cart { position: fixed; inset: 0; z-index: 25; max-height: none; border: none; transform: translateY(100%); transition: transform .2s; padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
    aside.cart.open { transform: none; }
    .cart .back { font-size: 15px; font-weight: 700; padding: 0 2px 10px; }
    .log { display: block; max-height: 22%; }
    .sizes { grid-template-columns: repeat(2, 1fr); }
    .sheet { padding: 16px; }
  }

  /* ---------- iPad縦（幅が狭いとき）：ジャンルを上、レシートを下に ---------- */
  @media (min-width: 601px) and (max-width: 900px) {
    header { flex-wrap: wrap; }
    header .spacer { display: none; }
    .hfield { flex: 1 1 200px; }
    .hfield input, .hfield select { width: 100%; }
    .main { min-width: 0; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr auto; }
    nav.genres { display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden; border-right: none; border-bottom: 1px solid var(--rule); padding: 8px 10px; }
    .genre { width: auto; white-space: nowrap; margin: 0; padding: 9px 14px; border-radius: 999px; border: 1.5px solid var(--gc, var(--ink)); }
    .genre.on { margin: 0; }
    aside.cart { border-left: none; border-top: 1px solid var(--rule); max-height: 46vh; padding-top: 10px; }
    .log { display: none; }
    .hfield input { width: 110px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>販売レジ</h1>
    <button class="hbtn phone-only" id="setBtn">公演・担当</button>
    <span class="badge" id="envBadge" hidden>テスト版</span>
    <div class="hsets" id="hsets">
    <label class="hfield"><span>公演</span><input id="event" placeholder="例：10/5 大阪 昼" autocomplete="off"></label>
    <label class="hfield"><span>担当</span><input id="operator" placeholder="名前" autocomplete="off"></label>
    <label class="hfield"><span>在庫</span><select id="pool"></select></label>
    </div>
    <div class="spacer"></div>
    <div class="net" id="net">オンライン</div>
    <button class="hbtn" id="salesBtn">売れたもの</button>
    <button class="hbtn" id="reload">在庫を更新</button>
  </header>
  <div class="main">
    <nav class="genres" id="genres"></nav>
    <section class="items">
      <div class="search"><input id="q" placeholder="商品名・色で探す" autocomplete="off"></div>
      <div class="grid" id="grid"></div>
    </section>
    <button class="cartbar phone-only" id="cartBar"><span id="barQty">0点</span><span id="barYen"></span><b>お会計へ ›</b></button>
    <aside class="cart" id="cart">
      <button class="phone-only back" id="cartClose">‹ 商品にもどる</button>
      <div class="receipt">
      <h2>お会計 <button id="clear">すべて消す</button></h2>
      <div class="lines" id="lines"></div>
      <div class="sum">
        <div class="row"><span>点数</span><b id="sumQty">0点</b></div>
        <div class="row big"><span>合計</span><span id="sumYen">—</span></div>
        <div class="note" id="sumNote"></div>
      </div>
      <div class="change" id="change" hidden>
        <div class="crow"><span>お預かり</span><input id="paidIn" inputmode="numeric" placeholder="円" autocomplete="off"><button id="paidClear">クリア</button></div>
        <div class="cbtns"><button data-paid="exact">ちょうど</button><button data-paid="1000">＋1,000</button><button data-paid="5000">＋5,000</button><button data-paid="10000">＋10,000</button></div>
        <div class="cout" id="changeOut"></div>
      </div>
      </div>
      <button class="pay" id="pay" disabled>会計する</button>
      <div class="log"><h3>この端末の記録（今日）</h3><div id="log"></div></div>
    </aside>
  </div>
</div>
<div id="sheet" hidden></div>
<div class="sales" id="sales" hidden>
  <div class="sales-hd">
    <button class="back" id="salesClose">‹ レジにもどる</button>
    <h2>売れたもの</h2>
    <div class="sales-filter">
      <select id="salesWhen"></select>
      <button class="hbtn2" id="salesReload">更新</button>
    </div>
    <div class="seg2" id="salesSeg">
      <button data-v="list" class="on">会計の順番</button>
      <button data-v="items">商品ごとの個数</button>
    </div>
    <div class="sales-sum" id="salesSum"></div>
  </div>
  <div class="sales-body" id="salesBody"></div>
</div>
<div class="login" id="login" hidden>
  <form id="loginForm">
    <h2>販売レジ</h2>
    <p>管理画面と同じパスワードを入れてください。この端末に保存されます。</p>
    <input id="key" type="password" placeholder="パスワード" autocomplete="current-password">
    <button>はじめる</button>
  </form>
</div>

<script>
(function () {
  'use strict';
  const API_URL = 'https://script.google.com/macros/s/AKfycbxj_wjVq-eC5T_MikXdrMD259UrUAY77VLipvt18RwFByywBXTmV4c5Id03cKw8DeI/exec';
  const ENV = 'test';
  const STORE = 'korokke' + (ENV ? '.' + ENV : '');
  const KEY_STORE = STORE + '.adminKey';     // 管理画面と同じパスワード置き場
  const REG_STORE = STORE + '.register';      // 公演名・担当・在庫区分
  const QUEUE_STORE = STORE + '.registerQueue'; // 未送信の会計
  const LOG_STORE = STORE + '.registerLog';   // この端末の記録

  // 数え方（管理画面・在庫確認ページと同じ）
  const UNIT_MAI = ['Tシャツ', 'ワイシャツ', 'タオル', 'マフラータオル', 'スポーツタオル', 'ハンドタオル', '手ぬぐい',
    'B5クリアファイル', 'クリアファイル', 'ステッカー', 'ストール'];
  const UNIT_HON = ['ペンライト', '傘', 'ストラップ', 'ネックストラップ'];
  const unitOf = t => UNIT_MAI.indexOf(t) >= 0 ? '枚' : UNIT_HON.indexOf(t) >= 0 ? '本' : '個';
  const SIZE_ORDER = ['XS', 'S', 'M', 'L', 'XL', 'XXL', '3XL', '4XL', 'フリー', '-'];

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 保存できなくても動かす */ } };
  const loadKey = () => { try { return localStorage.getItem(KEY_STORE) || ''; } catch (e) { return ''; } };
  const yen = n => n.toLocaleString('ja-JP') + '円';

  const state = { key: loadKey(), products: [], owners: [], genre: '', q: '', cart: {}, bundles: [], sets: [], order: [], paid: '', sending: false };
  const settings = load(REG_STORE, { event: '', operator: '', pool: '' });

  function imageSrc(url, w) {
    const m = String(url || '').match(/\/d\/([\w-]{20,})|[?&]id=([\w-]{20,})/);
    const id = m && (m[1] || m[2]);
    return id ? 'https://lh3.googleusercontent.com/d/' + id + '=w' + w : url;
  }
  // ジャンルの色（虹の7色。管理画面・在庫確認ページと同じ）
  const FAMILY = [['t', /シャツ/], ['towel', /タオル|手ぬぐい/], ['file', /ファイル/], ['knit', /ニット|ストール|帽/],
    ['key', /キー|ストラップ/], ['mag', /マグネット|ステッカー/], ['goods', /./]];
  const famOf = t => (FAMILY.find(f => f[1].test(t || '')) || FAMILY[6])[0];
  const famRank = t => FAMILY.findIndex(f => f[0] === famOf(t));
  const gc = t => '--gc:var(--g-' + famOf(t) + ')';
  // 写真：あれば写真、なければ商品名を大きく
  const pic = (img, t, name, cls) => img ? '<div class="' + cls + '" style="background-image:url(\'' + esc(imageSrc(img, 400)) + '\')"></div>'
    : '<div class="' + cls + ' txt" style="' + gc(t) + '">' + esc(name) + '</div>';

  function toast(msg, err) {
    const t = document.createElement('div');
    t.className = 'toast' + (err ? ' err' : '');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), err ? 4500 : 2200);
  }

  // ---------- サーバー ----------
  async function api(action, params, timeoutMs) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs || 30000);
    try {
      const body = Object.assign({ action: action, key: state.key }, params);
      if (ENV) body.env = ENV;
      const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body), credentials: 'omit', signal: ctrl.signal });
      const res = await r.json();
      if (!res.ok) { const e = new Error(res.error || 'エラー'); e.server = true; throw e; }
      return res.data;
    } finally {
      clearTimeout(timer);
    }
  }

  // 端末に保存した在庫で表示する（オフラインのとき・読み込めなかったとき）
  function useCached() {
    const cached = load(STORE + '.registerProducts', null);
    const cc = load(STORE + '.registerConfig', {});
    state.sets = cc.sets || []; state.order = cc.order || [];
    if (cached && !state.products.length) { state.products = cached; state.owners = cc.owners || ['現場用', 'ファンクラブ用', '販売在庫']; applyPending(); fillPools(); render(); }
    return !!cached;
  }

  // まだ送れていない会計の分だけ、表示の在庫を減らす
  function applyPending() {
    load(QUEUE_STORE, []).forEach(entry => {
      if (entry.kind === 'undo') return restoreStock(entry.opId);
      entry.items.forEach(i => { const p = byId(i.id); if (p) p.stock[entry.pool] = Math.max(0, (p.stock[entry.pool] || 0) - i.qty); });
    });
  }
  // 取り消した会計の分だけ、表示の在庫を戻す（送った会計は端末の記録から）
  function restoreStock(opId) {
    const e = load(LOG_STORE, []).find(x => x.opId === opId);
    if (!e || !e.lines) return;
    e.lines.forEach(i => { const p = byId(i.id); if (p) p.stock[e.pool] = (p.stock[e.pool] || 0) + i.qty; });
  }

  // 商品写真を前もって端末に保存しておく（オフラインでも写真が出るように）
  let prefetched = false;
  function prefetchImages() {
    if (prefetched || !('serviceWorker' in navigator) || !navigator.serviceWorker.controller) return;
    prefetched = true;
    const urls = [...new Set(state.products.filter(p => p.imageUrl).map(p => imageSrc(p.imageUrl, 400)))];
    let i = 0;
    const next = () => { if (i >= urls.length || !navigator.onLine) return; fetch(urls[i++], { mode: 'no-cors' }).catch(() => {}).then(next); };
    next(); next(); next();
  }

  async function loadProducts(quiet) {
    if (!navigator.onLine && !quiet) { toast('オフラインです。端末に保存した在庫で表示しています', true); }
    if (!navigator.onLine) { useCached(); return; }
    try {
      const d = await api('getBootData', {}, 20000);
      state.products = d.products.filter(p => !p.discontinued);
      state.owners = d.config.owners || ['現場用'];
      state.sets = d.config.sets || [];
      state.order = d.config.displayOrder || [];
      save(STORE + '.registerProducts', state.products);
      save(STORE + '.registerConfig', { sets: state.sets, order: state.order, owners: state.owners });
      applyPending();
      fillPools();
      render();
      prefetchImages();
      if (!quiet) toast('在庫を最新にしました');
    } catch (e) {
      if (e.server && /パスワード/.test(e.message)) return showLogin();
      useCached();
      toast('在庫を読み込めませんでした（前回の在庫で表示）', true);
    }
  }

  function fillPools() {
    const sel = $('pool');
    sel.innerHTML = state.owners.map(o => '<option>' + esc(o) + '</option>').join('');
    sel.value = state.owners.indexOf(settings.pool) >= 0 ? settings.pool : state.owners[0];
  }

  // ---------- 商品をカード（種類・商品名・色）ごとにまとめる ----------
  // セットだけで売る種類（管理画面の「セットだけ」）。レジでは1個ずつ入れられない
  const setOnly = () => state.sets.filter(x => x.only).map(x => x.type);

  function groups() {
    const pool = $('pool').value;
    const only = setOnly();
    const q = state.q.trim().normalize('NFKC').toLowerCase();
    const map = {}, list = [];
    state.products.forEach(p => {
      if (state.genre && p.type !== state.genre) return;
      if (only.indexOf(p.type) >= 0) return;
      const text = [p.category, p.type, p.color, p.size].join(' ').normalize('NFKC').toLowerCase();
      if (q && text.indexOf(q) < 0) return;
      const k = [p.type, p.category, p.color].join('|');
      let g = map[k];
      if (!g) { g = map[k] = { key: k, type: p.type, category: p.category, color: p.color, items: [], stock: 0, img: '' }; list.push(g); }
      g.items.push(p);
      g.stock += p.stock[pool] || 0;
      if (!g.img && p.imageUrl) g.img = p.imageUrl;
    });
    list.forEach(g => g.items.sort((a, b) => SIZE_ORDER.indexOf(a.size) - SIZE_ORDER.indexOf(b.size)));
    // 在庫があるものを先に、その中は商品名順
    // 管理画面で決めた「売り場の並び順」があればその順。売り切れは後ろへ
    const rank = {};
    state.order.forEach((k, i) => { rank[k] = i; });
    const r = g => { const k = [g.category, g.type, g.color].join('|'); return k in rank ? rank[k] : 1e6; };
    return list.sort((a, b) => (b.stock > 0) - (a.stock > 0) || r(a) - r(b) || a.type.localeCompare(b.type, 'ja') || a.category.localeCompare(b.category, 'ja'));
  }

  // カゴに入っている数（単品＋セットの中身）
  const qtyIn = id => (state.cart[id] || 0) + state.bundles.reduce((n, b) => n + b.ids.filter(x => x === id).length, 0);
  const inCart = ids => ids.reduce((n, id) => n + qtyIn(id), 0);
  const byId = id => state.products.find(p => p.id === id);

  // サイズのハンガー札（押すとそのままカゴへ）。残りは「在庫 − カゴの数」
  function tag(p, pool, wide) {
    const s = p.stock[pool] || 0, c = qtyIn(p.id), left = s - c;
    const cls = s === 0 ? ' out' : left <= 3 ? ' low' : '';
    return '<button class="tag' + cls + '" data-add="' + esc(p.id) + '"' + (left > 0 ? '' : ' disabled') + ' aria-label="' + esc((p.size !== '-' ? p.size + ' ' : '') + '残り' + left) + '">' +
      '<i>' + (wide ? '在庫' : esc(p.size)) + '</i><b>' + left + '</b>' + (wide ? '<i>' + unitOf(p.type) + '</i>' : '') + (c ? '<span class="c">' + c + '</span>' : '') + '</button>';
  }
  function rack(items, pool, one) {
    return '<div class="rack' + (one ? ' wide' : '') + '"' + (!one && items.length > 4 ? ' style="grid-template-columns:repeat(' + Math.min(items.length, 5) + ',minmax(0,1fr))"' : '') + '>' +
      items.map(p => tag(p, pool, one)).join('') + '</div>';
  }

  function render() {
    // ジャンル
    const counts = {};
    state.products.forEach(p => { counts[p.type] = (counts[p.type] || 0) + 1; });
    const types = Object.keys(counts).sort((a, b) => famRank(a) - famRank(b) || counts[b] - counts[a]);
    $('genres').innerHTML = ['', ...types].map(t =>
      '<button class="genre' + (state.genre === t ? ' on' : '') + '" data-genre="' + esc(t) + '"' + (t ? ' style="' + gc(t) + '"' : '') + '><i></i>' + (t ? esc(t) : 'すべて') +
      '</button>').join('');
    // 商品
    const gs = groups();
    const qn = state.q.trim().normalize('NFKC').toLowerCase();
    const setTiles = state.sets.map((x, i) => ({ x: x, i: i })).filter(o => (!state.genre || state.genre === o.x.type) &&
      (!qn || (o.x.name + ' ' + o.x.type + ' ' + state.products.filter(p => p.type === o.x.type).map(p => p.category).join(' ')).normalize('NFKC').toLowerCase().indexOf(qn) >= 0));
    const pool = $('pool').value;
    $('grid').innerHTML = setTiles.map(o => '<div class="tile settile" style="' + gc(o.x.type) + '"><span class="gtab">セット</span><div class="tcard">' +
      '<button class="tpic" data-set="' + o.i + '"><div class="ph txt" style="' + gc(o.x.type) + '">' + esc(o.x.name) + '</div></button>' +
      '<div class="tx"><b>' + esc(o.x.name) + '</b><div class="sub">' + esc(o.x.type) + 'から好きな' + o.x.count + unitOf(o.x.type) + '</div></div>' +
      '<div class="price">' + yen(o.x.price) + '</div></div></div>').join('') +
      (gs.length ? gs.map(g => {
      const n = inCart(g.items.map(p => p.id));
      const one = g.items.length === 1 && (!g.items[0].size || g.items[0].size === '-');
      return '<div class="tile' + (g.stock > 0 ? '' : ' zero') + '" style="' + gc(g.type) + '"><span class="gtab">' + esc(g.type) + '</span><div class="tcard">' +
        '<button class="tpic" data-key="' + esc(g.key) + '">' + pic(g.img, g.type, g.category, 'ph') + (n ? '<span class="incart">' + n + '</span>' : '') + '</button>' +
        '<div class="tx"><b>' + esc(g.category) + '</b><div class="sub">' + esc(g.color !== '-' ? g.color : '') + '</div></div>' +
        rack(g.items, pool, one) + '</div></div>';
    }).join('') : '<div class="empty">商品が見つかりません</div>');
    renderCart();
  }

  function renderCart() {
    const ids = Object.keys(state.cart).filter(id => state.cart[id] > 0);
    const pool = $('pool').value;
    let qty = 0, total = 0, unpriced = 0;
    const bundleHtml = state.bundles.map((b, i) => {
      qty += b.ids.length; total += b.price;
      return '<div class="line"><div class="th txt" style="' + gc(byId(b.ids[0]) ? byId(b.ids[0]).type : '') + '">セット</div><div><b>' + esc(b.name) + '</b><small>' + b.ids.map(id => { const p = byId(id); return p ? esc([p.category, p.color !== '-' ? p.color : '', p.size !== '-' ? p.size : ''].filter(Boolean).join(' ')) : esc(id); }).join('<br>') +
        '　' + yen(b.price) + '</small></div><div class="qty"><button data-unbundle="' + i + '">✕</button></div></div>';
    }).join('');
    $('lines').innerHTML = (ids.length || state.bundles.length) ? bundleHtml + ids.map(id => {
      const p = byId(id); const n = state.cart[id];
      qty += n;
      if (p.price === '' || p.price == null) unpriced += n; else total += p.price * n;
      const th = pic(p.imageUrl, p.type, p.category, 'th');
      const desc = [p.type, p.color !== '-' ? p.color : '', p.size !== '-' ? p.size : ''].filter(Boolean).join(' / ');
      const price = p.price === '' || p.price == null ? '' : '　' + yen(p.price * n);
      return '<div class="line">' + th + '<div><b>' + esc(p.category) + '</b><small>' + esc(desc) + '　残り' + (p.stock[pool] || 0) + price + '</small></div>' +
        '<div class="qty"><button data-dec="' + esc(id) + '">−</button><span>' + n + '</span><button data-inc="' + esc(id) + '">＋</button></div></div>';
    }).join('') : '<div class="cart-empty">商品の写真をタップすると<br>ここに入ります</div>';
    state.total = unpriced === qty ? 0 : total;
    $('sumQty').textContent = qty + '点';
    $('barQty').textContent = qty ? qty + '点' : 'まだ空です';
    $('barYen').textContent = qty && unpriced < qty ? yen(total) : '';
    $('cartBar').classList.toggle('empty', !qty);
    $('sumYen').textContent = qty ? (unpriced === qty ? '価格未設定' : yen(total)) : '—';
    $('sumNote').textContent = unpriced && unpriced < qty ? '※ 価格未設定の商品が' + unpriced + '点あります（合計に入っていません）'
      : unpriced ? '※ 管理画面で価格を入れると合計金額が出ます' : '';
    $('pay').disabled = !qty || state.sending;
    renderChange();
    renderLog();
  }

  // ---------- お預かり・おつり ----------
  function renderChange() {
    const box = $('change');
    if (!state.total) { box.hidden = true; return; }
    box.hidden = false;
    const paid = Number(String(state.paid).replace(/[^0-9]/g, '')) || 0;
    $('paidIn').value = state.paid;
    $('changeOut').innerHTML = !paid ? '' : paid < state.total ? '<span class="short">あと ' + yen(state.total - paid) + '</span>' : 'おつり <b>' + yen(paid - state.total) + '</b>';
  }

  function add(id, d) {
    const p = byId(id); if (!p) return;
    if (d > 0 && setOnly().indexOf(p.type) >= 0) return toast(p.type + 'はセットだけで売ります。「セット」の札から選んでください', true);
    const pool = $('pool').value;
    const next = (state.cart[id] || 0) + d;
    if (d > 0 && qtyIn(id) + d > (p.stock[pool] || 0)) return toast(p.category + '（' + (p.size !== '-' ? p.size : p.color) + '）は在庫が' + (p.stock[pool] || 0) + unitOf(p.type) + 'です', true);
    if (next <= 0) delete state.cart[id]; else state.cart[id] = next;
    render();
  }

  function openSizes(g) {
    const pool = $('pool').value;
    $('sheet').innerHTML = '<div class="sheet-bg" data-close="1"><div class="sheet"><div class="hd">' + pic(g.img, g.type, g.category, 'ph') +
      '<div><b>' + esc(g.category) + '</b><small>' + esc([g.type, g.color !== '-' ? g.color : ''].filter(Boolean).join(' / ')) + '</small></div></div>' +
      '<div class="sizes">' + g.items.map(p => tag(p, pool, false)).join('') + '</div><button class="close" data-close="1">閉じる</button></div></div>';
    $('sheet').hidden = false;
    $('sheet').dataset.key = g.key;
  }

  // ---------- 会計（オフライン時は端末に保存して、つながったら送る） ----------
  function log() { return load(LOG_STORE, []).filter(e => e.at.slice(0, 10) === today()); }  // 日本時間の今日

  // 未送信の会計の金額（値段が入っている分だけ）
  function entryAmount(entry) {
    return entry.items.reduce((n, i) => {
      if (i.unitPrice !== undefined) return n + i.unitPrice * i.qty;
      const p = byId(i.id); return n + (p && p.price !== '' && p.price != null ? p.price * i.qty : 0);
    }, 0);
  }

  function renderLog() {
    const q = load(QUEUE_STORE, []);
    const sales = q.filter(e => e.kind !== 'undo');
    const undoing = q.filter(e => e.kind === 'undo').map(e => e.opId);
    const entries = sales.map(e => Object.assign({ pending: true, amount: entryAmount(e) }, e)).reverse().concat(log().reverse()).slice(0, 30);
    $('log').innerHTML = entries.length ? entries.map(e => {
      const later = !e.pending && undoing.indexOf(e.opId) >= 0;
      const names = e.pending ? e.names : e.items;
      const btn = e.pending ? '<button data-unq="' + esc(e.lid || '') + '">取り消す</button>'
        : !e.undone && !later && e.opId ? '<button data-undo="' + esc(e.opId) + '">取り消す</button>' : '';
      return '<div class="ent' + (e.pending ? ' pending' : '') + (e.undone || later ? ' undone' : '') + '"><span><b>' + e.at.slice(11, 16) + '　' + e.qty + '点' +
        (e.amount ? '　' + yen(e.amount) : '') + (e.pending ? '　未送信' : '') + (e.undone ? '　取消済' : '') + (later ? '　取消（つながったら送ります）' : '') + '</b>' +
        ((names || []).length ? '<small class="what">' + names.map(esc).join('<br>') + '</small>' : '') + '</span>' + btn + '</div>';
    }).join('') : '<div style="color:var(--muted)">まだありません</div>';
    const n = q.length;
    $('net').textContent = !navigator.onLine ? 'オフライン' + (n ? '（未送信 ' + n + '件）' : '') : n ? '未送信 ' + n + '件' : 'オンライン';
    $('net').className = 'net' + (!navigator.onLine || n ? ' off' : '');
  }

  // 記録に出す「何を売ったか」（例：コロダス ゴールド S ×2）
  function itemNames(items) {
    return items.map(i => {
      const p = byId(i.id);
      if (!p) return i.id + ' ×' + i.qty;
      return [p.category, p.color !== '-' ? p.color : '', p.size !== '-' ? p.size : ''].filter(Boolean).join(' ') + ' ×' + i.qty;
    });
  }

  async function send(entry) {
    const res = await api('processBatch', { mode: 'sale', location: entry.pool, event: entry.event, operator: entry.operator,
      items: entry.items.map(i => i.unitPrice !== undefined ? { productId: i.id, quantity: i.qty, unitPrice: i.unitPrice } : { productId: i.id, quantity: i.qty }) }, 45000);
    const l = load(LOG_STORE, []);
    l.push({ at: entry.at, qty: res.quantity, amount: res.amount, opId: res.opId, items: entry.names || itemNames(entry.items),
      lines: entry.items.map(i => ({ id: i.id, qty: i.qty })), pool: entry.pool, operator: entry.operator, event: entry.event });
    save(LOG_STORE, l.slice(-300));
    res.products.forEach(np => { const i = state.products.findIndex(p => p.id === np.id); if (i >= 0) state.products[i] = Object.assign(state.products[i], np); });
    return res;
  }

  async function pay() {
    const items = Object.keys(state.cart).filter(id => state.cart[id] > 0).map(id => ({ id: id, qty: state.cart[id] }));
    // セットは値段を中身に割り振る（割り切れない分は1つ目に足す）
    const names = itemNames(items);
    state.bundles.forEach(b => {
      const each = Math.floor(b.price / b.ids.length);
      b.ids.forEach((id, k) => items.push({ id: id, qty: 1, unitPrice: each + (k === 0 ? b.price - each * b.ids.length : 0) }));
      names.unshift('セット ' + b.name + '（' + itemNames(b.ids.map(id => ({ id: id, qty: 1 }))).map(n => n.replace(/ ×1$/, '')).join('・') + '）');
    });
    if (!items.length) return;
    const entry = { at: new Date(Date.now() + 9 * 3600e3).toISOString().replace('Z', ''), pool: $('pool').value, event: $('event').value.trim(),
      operator: $('operator').value.trim(), items: items, qty: items.reduce((n, i) => n + i.qty, 0), names: names };
    state.sending = true; renderCart();
    if (!navigator.onLine) {
      queue(entry, '電波がないので端末に保存しました。つながったら自動で送ります');
    } else {
      try {
        const res = await send(entry);
        state.cart = {}; state.bundles = []; state.paid = '';
        $('cart').classList.remove('open');
        toast(res.quantity + '点の販売を記録しました' + (res.amount ? '（' + yen(res.amount) + '）' : ''));
      } catch (e) {
        if (e.server) { toast(e.message, true); }
        else if (e.name === 'AbortError') { toast('通信が途中で切れました。下の記録と在庫を確認してからやり直してください', true); }
        else { queue(entry, '送れなかったので端末に保存しました。つながったら自動で送ります'); }
      }
    }
    state.sending = false; render();
  }

  function queue(entry, msg) {
    entry.names = entry.names || itemNames(entry.items);
    entry.lid = 'L' + Date.now() + Math.random().toString(36).slice(2, 6);
    const q = load(QUEUE_STORE, []); q.push(entry); save(QUEUE_STORE, q);
    // 在庫の表示だけ先に減らしておく
    entry.items.forEach(i => { const p = byId(i.id); if (p) p.stock[entry.pool] = Math.max(0, (p.stock[entry.pool] || 0) - i.qty); });
    state.cart = {}; state.bundles = []; state.paid = '';
    toast(msg);
  }

  async function flush() {
    if (!navigator.onLine || state.flushing) return;
    let q = load(QUEUE_STORE, []);
    if (!q.length) return;
    state.flushing = true;
    try {
      while (q.length) {
        try {
          if (q[0].kind === 'undo') {
            await api('undoOperation', { opId: q[0].opId, operator: q[0].operator });
            const l = load(LOG_STORE, []); l.forEach(x => { if (x.opId === q[0].opId) x.undone = true; }); save(LOG_STORE, l);
          } else await send(q[0]);
        } catch (e) { if (!e.server) break; toast((q[0].kind === 'undo' ? '取り消しを送れませんでした：' : '未送信の会計を送れませんでした：') + e.message, true); }
        q = load(QUEUE_STORE, []); q.shift(); save(QUEUE_STORE, q);
      }
      if (!q.length) { toast('未送信の会計をすべて送りました'); loadProducts(true); }
    } finally { state.flushing = false; renderLog(); }
  }

  // まだ送っていない会計の取り消し：端末から消して在庫の表示を戻すだけ（サーバーには何も送らない）
  function unqueue(lid, btn) {
    if (!btn.dataset.armed) { btn.dataset.armed = '1'; btn.textContent = 'もう一度押すと取消'; setTimeout(() => { delete btn.dataset.armed; btn.textContent = '取り消す'; }, 4000); return; }
    const q = load(QUEUE_STORE, []);
    const i = q.findIndex(e => e.lid === lid && e.kind !== 'undo');
    if (i < 0) return;
    const entry = q.splice(i, 1)[0];
    save(QUEUE_STORE, q);
    entry.items.forEach(x => { const p = byId(x.id); if (p) p.stock[entry.pool] = (p.stock[entry.pool] || 0) + x.qty; });
    toast('未送信の会計を取り消しました');
    render();
  }

  async function undo(opId) {
    // 押し間違い防止：1回目は確認表示だけ
    const btn = document.querySelector('[data-undo="' + opId + '"]');
    if (btn && !btn.dataset.armed) { btn.dataset.armed = '1'; btn.textContent = 'もう一度押すと取消'; setTimeout(() => { delete btn.dataset.armed; btn.textContent = '取り消す'; }, 4000); return; }
    if (!navigator.onLine) {
      // 電波がないときは取り消しを予約して、つながったら送る。在庫の表示はすぐ戻す
      const q = load(QUEUE_STORE, []);
      q.push({ kind: 'undo', opId: opId, operator: $('operator').value.trim(), at: new Date(Date.now() + 9 * 3600e3).toISOString().replace('Z', '') });
      save(QUEUE_STORE, q);
      restoreStock(opId);
      toast('取り消しました（電波がないので、つながったら送ります）');
      return render();
    }
    try {
      await api('undoOperation', { opId: opId, operator: $('operator').value.trim() });
      const l = load(LOG_STORE, []); l.forEach(e => { if (e.opId === opId) e.undone = true; }); save(LOG_STORE, l);
      toast('取り消しました'); loadProducts(true);
    } catch (e) { toast(e.message, true); }
  }

  // ---------- 操作 ----------
  document.addEventListener('click', e => {
    const t = e.target.closest('button, .sheet-bg');
    if (!t) return;
    if (t.dataset.genre !== undefined) { state.genre = t.dataset.genre; render(); $('grid').parentElement.scrollTop = 0; return; }
    if (t.dataset.set !== undefined) return openSet(+t.dataset.set);
    if (t.dataset.pick) return pickForSet(t.dataset.pick);
    if (t.dataset.setDone) return finishSet();
    if (t.dataset.unbundle !== undefined) { state.bundles.splice(+t.dataset.unbundle, 1); return render(); }
    if (t.dataset.paid !== undefined) { state.paid = t.dataset.paid === 'exact' ? String(state.total) : String((Number(state.paid) || 0) + Number(t.dataset.paid)); return renderChange(); }
    if (t.classList.contains('tpic') && t.dataset.key) {
      const g = groups().find(x => x.key === t.dataset.key); if (!g) return;
      if (g.items.length === 1) add(g.items[0].id, 1); else openSizes(g);
      return;
    }
    if (t.dataset.add) {
      add(t.dataset.add, 1);
      if (!$('sheet').hidden) { const g = groups().find(x => x.key === $('sheet').dataset.key); if (g) openSizes(g); }
      return;
    }
    if (t.dataset.close && (e.target === t || t.tagName === 'BUTTON')) { $('sheet').hidden = true; return; }
    if (t.dataset.inc) return add(t.dataset.inc, 1);
    if (t.dataset.dec) return add(t.dataset.dec, -1);
    if (t.dataset.undo) return undo(t.dataset.undo);
    if (t.dataset.unq !== undefined) return unqueue(t.dataset.unq, t);
  });
  $('q').addEventListener('input', e => { state.q = e.target.value; render(); });
  $('clear').addEventListener('click', () => { state.cart = {}; state.bundles = []; state.paid = ''; render(); });
  $('paidIn').addEventListener('input', e => { state.paid = e.target.value; renderChange(); });
  $('paidClear').addEventListener('click', () => { state.paid = ''; renderChange(); });

  // ---------- セット販売（例：クリアファイル好きな2枚で500円） ----------
  function openSet(i) {
    const x = state.sets[i];
    state.picking = { set: x, ids: [] };
    drawSet();
  }
  function drawSet() {
    const { set, ids } = state.picking;
    const pool = $('pool').value;
    const list = state.products.filter(p => p.type === set.type);
    $('sheet').innerHTML = '<div class="sheet-bg" data-close="1"><div class="sheet"><div class="hd"><div class="ph txt" style="' + gc(set.type) + '">セット</div><div><b>' + esc(set.name) + '　' + yen(set.price) +
      '</b><small>好きな' + set.count + unitOf(set.type) + 'を選んでください（' + ids.length + ' / ' + set.count + '）</small></div></div>' +
      '<div class="sizes setpick">' + list.map(p => {
        const left = (p.stock[pool] || 0) - qtyIn(p.id) - ids.filter(x => x === p.id).length;
        const c = ids.filter(x => x === p.id).length;
        const ph = p.imageUrl ? '<span class="sph" style="background-image:url(\'' + esc(imageSrc(p.imageUrl, 400)) + '\')"></span>' : '';
        return '<button class="size" data-pick="' + esc(p.id) + '"' + (left > 0 && ids.length < set.count ? '' : ' disabled') + '>' + ph + '<b class="sn">' + esc(p.category) + '</b><small>' +
          esc([p.color !== '-' ? p.color : '', p.size !== '-' ? p.size : ''].filter(Boolean).join(' ')) + '　残り ' + Math.max(0, left) + '</small>' + (c ? '<br><span class="c">選択 ' + c + '</span>' : '') + '</button>';
      }).join('') + '</div><div class="setbtns"><button class="close" data-close="1">やめる</button>' +
      '<button class="close ok" data-set-done="1"' + (ids.length === set.count ? '' : ' disabled') + '>カゴに入れる</button></div></div></div>';
    $('sheet').hidden = false;
    $('sheet').dataset.key = '';
  }
  function pickForSet(id) {
    if (!state.picking) return;
    if (state.picking.ids.length < state.picking.set.count) state.picking.ids.push(id);
    drawSet();
  }
  function finishSet() {
    const { set, ids } = state.picking;
    if (ids.length !== set.count) return;
    state.bundles.push({ name: set.name, price: set.price, ids: ids.slice() });
    state.picking = null;
    $('sheet').hidden = true;
    render();
  }
  $('pay').addEventListener('click', pay);

  // ---------- 売れたもの（全端末の記録をサーバーから読む） ----------
  const salesState = { view: 'list', data: null };
  function today() { return new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10); }
  function fillWhen(events) {
    const sel = $('salesWhen'), cur = sel.value;
    const days = [0, 1, 2, 3, 4, 5, 6].map(d => new Date(Date.now() + 9 * 3600e3 - d * 864e5).toISOString().slice(0, 10));
    sel.innerHTML = days.map((d, i) => '<option value="d:' + d + '">' + (i === 0 ? '今日' : i === 1 ? '昨日' : '') + '（' + d.slice(5).replace('-', '/') + '）</option>').join('') +
      (events || []).map(e => '<option value="e:' + esc(e) + '">公演：' + esc(e) + '（全日）</option>').join('');
    if (cur && [...sel.options].some(o => o.value === cur)) sel.value = cur;
  }
  // オフラインのとき：この端末の記録（送った分＋未送信）から「売れたもの」を作る
  function localSales(day) {
    const fmt = at => at.slice(5, 7) + '/' + at.slice(8, 10) + ' ' + at.slice(11, 16);
    const q = load(QUEUE_STORE, []);
    const undoing = q.filter(e => e.kind === 'undo').map(e => e.opId);
    const lines = ls => (ls || []).map(i => { const p = byId(i.id) || { category: i.id, color: '-', size: '-', type: '' };
      return { id: i.id, category: p.category, color: p.color, size: p.size, type: p.type, qty: i.qty }; });
    const sent = load(LOG_STORE, []).filter(e => e.at.slice(0, 10) === day && e.lines).map(e => ({ at: fmt(e.at), operator: e.operator || '', qty: e.qty,
      amount: e.amount || 0, undone: !!e.undone || undoing.indexOf(e.opId) >= 0, items: lines(e.lines) }));
    const pend = q.filter(e => e.kind !== 'undo' && e.at.slice(0, 10) === day).map(e => ({ at: fmt(e.at), operator: (e.operator || '') + '・未送信', qty: e.qty,
      amount: entryAmount(e), undone: false, items: lines(e.items) }));
    return { sales: sent.concat(pend).sort((a, b) => a.at < b.at ? 1 : -1), events: [], local: true };
  }

  async function loadSales() {
    const v = $('salesWhen').value || 'd:' + today();
    $('salesBody').innerHTML = '<div class="empty">読み込み中…</div>';
    if (!navigator.onLine || load(QUEUE_STORE, []).length) {
      // 電波がない・未送信があるときは、この端末の記録で出す（全端末の合計は、つながってから）
      if (v[0] === 'd' || !navigator.onLine) { salesState.data = localSales(v[0] === 'd' ? v.slice(2) : today()); fillWhen([]); return renderSales(); }
    }
    try {
      const d = await api('getSales', v[0] === 'e' ? { event: v.slice(2) } : { date: v.slice(2) }, 30000);
      salesState.data = d;
      fillWhen(d.events);
      renderSales();
    } catch (e) {
      $('salesBody').innerHTML = '<div class="empty">読み込めませんでした（' + esc(e.message) + '）</div>';
    }
  }
  function renderSales() {
    const sales = (salesState.data && salesState.data.sales) || [];
    const live = sales.filter(x => !x.undone);
    const qty = live.reduce((n, x) => n + x.qty, 0), amt = live.reduce((n, x) => n + x.amount, 0);
    $('salesSum').innerHTML = '<span><b>' + live.length + '</b>会計</span><span><b>' + qty + '</b>点</span>' + (amt ? '<span><b>' + yen(amt) + '</b></span>' : '') +
      (salesState.data && salesState.data.local ? '<span class="localnote">この端末の記録だけを出しています（未送信を含む）。ほかの端末の分は、つながって送り終わると出ます</span>' : '');
    document.querySelectorAll('#salesSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === salesState.view));
    if (!sales.length) { $('salesBody').innerHTML = '<div class="empty">この日の販売はまだありません</div>'; return; }
    const label = i => [i.category, i.color !== '-' ? i.color : '', i.size !== '-' ? i.size : ''].filter(Boolean).join(' ');
    const shime = (salesState.data && !salesState.data.event) ? '<div class="shime"><b>締め（精算チェック）</b><div class="shrow">記録の合計 <b>' + (amt ? yen(amt) : '価格未設定') + '</b>' +
      '<label>実際の金額（レシート・現金） <input id="realYen" inputmode="numeric" placeholder="円" value="' + esc(salesState.real || '') + '"></label><span id="shimeDiff"></span></div></div>' : '';
    if (salesState.view === 'list') {
      $('salesBody').innerHTML = shime + sales.map((x, k) => '<div class="sale' + (x.undone ? ' undone' : '') + '"><div class="top"><b>' + esc(x.at.slice(6)) + '</b>' +
        '<span>' + x.qty + '点' + (x.operator ? '・' + esc(x.operator) : '') + (x.undone ? '・取消済' : '') + '</span>' +
        '<span class="amt">' + (x.amount ? yen(x.amount) : '') + '</span></div><ul>' +
        x.items.map(i => '<li>' + esc(label(i)) + ' <span>' + esc(i.type) + '</span>　×' + i.qty + '</li>').join('') + '</ul></div>').join('');
      shimeDiff();
      return;
    }
    // 商品ごと（ジャンル別にまとめて多い順）
    const byKey = {}, list = [];
    live.forEach(x => x.items.forEach(i => {
      const k = i.id;
      if (!byKey[k]) { byKey[k] = Object.assign({ n: 0 }, i); list.push(byKey[k]); }
      byKey[k].n += i.qty;
    }));
    const types = {};
    list.forEach(i => { (types[i.type] = types[i.type] || []).push(i); });
    const order = Object.keys(types).sort((a, b) => types[b].reduce((n, i) => n + i.n, 0) - types[a].reduce((n, i) => n + i.n, 0));
    $('salesBody').innerHTML = shime + '<div class="rank">' + order.map(t => {
      const items = types[t].sort((a, b) => b.n - a.n);
      return '<div class="gh" style="' + gc(t) + '">' + esc(t) + '　計 ' + items.reduce((n, i) => n + i.n, 0) + unitOf(t) + '</div>' +
        items.map((i, k) => '<div class="r"><span class="no">' + (k + 1) + '</span><span>' + esc(i.category) +
          '<small>' + esc([i.color !== '-' ? i.color : '', i.size !== '-' ? i.size : ''].filter(Boolean).join(' / ')) + '</small></span>' +
          '<span class="n">' + i.n + '<small>' + unitOf(i.type) + '</small></span></div>').join('');
    }).join('') + '</div>';
    shimeDiff();
  }
  $('salesBtn').addEventListener('click', () => { $('sales').hidden = false; if (!$('salesWhen').options.length) fillWhen([]); loadSales(); });
  $('salesClose').addEventListener('click', () => { $('sales').hidden = true; });
  $('salesWhen').addEventListener('change', loadSales);
  $('salesReload').addEventListener('click', loadSales);
  function shimeDiff() {
    const el = $('shimeDiff'); if (!el) return;
    const live = ((salesState.data && salesState.data.sales) || []).filter(x => !x.undone);
    const amt = live.reduce((n, x) => n + x.amount, 0);
    const real = Number(String(salesState.real || '').replace(/[^0-9]/g, ''));
    el.innerHTML = !salesState.real ? '' : real === amt ? '<span class="ok">ぴったりです</span>' : '<span class="ng">差額 ' + (real > amt ? '＋' : '−') + yen(Math.abs(real - amt)) + (real > amt ? '（多い）' : '（足りない）') + '</span>';
  }
  $('salesBody').addEventListener('input', e => { if (e.target.id === 'realYen') { salesState.real = e.target.value; shimeDiff(); } });
  $('salesSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; salesState.view = b.dataset.v; renderSales(); });
  $('setBtn').addEventListener('click', () => $('hsets').classList.toggle('open'));
  $('cartBar').addEventListener('click', () => $('cart').classList.add('open'));
  $('cartClose').addEventListener('click', () => $('cart').classList.remove('open'));
  $('reload').addEventListener('click', () => loadProducts());
  ['event', 'operator', 'pool'].forEach(id => {
    $(id).value = settings[id] || $(id).value;
    $(id).addEventListener('change', () => { settings[id] = $(id).value; save(REG_STORE, settings); if (id === 'pool') { state.cart = {}; render(); } });
  });
  window.addEventListener('online', () => { renderLog(); flush(); });
  window.addEventListener('offline', renderLog);
  setInterval(flush, 20000);

  function showLogin() { $('login').hidden = false; $('key').focus(); }
  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    state.key = $('key').value.trim();
    try { await api('checkKey', {}, 15000); try { localStorage.setItem(KEY_STORE, state.key); } catch (err) { /* */ } $('login').hidden = true; loadProducts(true); }
    catch (err) { toast('パスワードが違います', true); }
  });

  if (ENV) $('envBadge').hidden = false;
  if (!state.key) showLogin(); else { loadProducts(true); flush(); }
  // GitHub Pages 版だけ：画面と写真を端末に保存して、オフラインでも開けるようにする
  if ('serviceWorker' in navigator && /github\.io$|^(127\.0\.0\.1|localhost)$/.test(location.hostname)) {
    navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(() => {
      if (!navigator.serviceWorker.controller) navigator.serviceWorker.addEventListener('controllerchange', prefetchImages, { once: true });
      else prefetchImages();
    }).catch(() => {});
  }
  renderLog();
})();
</script>
</body>
</html>
