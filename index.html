<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#121418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="グッズ在庫">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>コロッケ グッズ在庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
  :root {
    --theme: #e67e22;
    --bg: #f4f5f7;
    --card: #fff;
    --text: #2c3e50;
    --muted: #7f8c8d;
    --line: #e3e6ea;
    --zero: #e74c3c;
    --low: #e67e22;
    --ok: #27ae60;
    --rainbow: linear-gradient(90deg, #ff4d4d, #ff9f1a, #ffd93d, #3ddc84, #29b6f6, #7c4dff, #e056fd);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    -webkit-text-size-adjust: 100%;
  }

  .top { position: sticky; top: 0; z-index: 10; background: var(--card); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .app-header {
    position: relative;
    display: flex; align-items: center; gap: 8px;
    padding: 7px 8px 10px 14px;
    background: radial-gradient(120% 140% at 0% 0%, #343a46 0%, #1d2027 55%, #121418 100%);
    color: #fff;
  }
  /* 下端のレインボーライン */
  .app-header::after {
    content: "";
    position: absolute; left: 0; right: 0; bottom: 0; height: 4px;
    background: var(--rainbow);
  }
  .brand { flex: 1; min-width: 0; }
  .brand h1 {
    margin: 0;
    font-family: "Dela Gothic One", "Hiragino Sans", sans-serif; font-weight: 400;
    font-size: 19px; line-height: 1.2; letter-spacing: .04em;
    background: var(--rainbow);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .brand .sub { font-size: 9px; font-weight: 700; letter-spacing: .3em; color: rgba(255,255,255,.55); }
  .updated { font-size: 11px; color: rgba(255,255,255,.7); white-space: nowrap; }
  .reload {
    width: 32px; height: 32px;
    border: 1px solid rgba(255,255,255,.25); border-radius: 50%;
    background: rgba(255,255,255,.08); color: #fff;
    font-size: 18px; cursor: pointer;
  }
  .reload.spin { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tab {
    flex: 1;
    padding: 9px 4px 7px;
    border: 0; border-bottom: 3px solid transparent;
    background: none; color: var(--muted);
    font: inherit; font-size: 14px; font-weight: 700;
    cursor: pointer;
  }
  .tab small { display: block; margin-top: 1px; font-size: 11px; font-weight: 400; }
  .tab.active { color: var(--tab-color); border-bottom-color: var(--tab-color); }

  .controls { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 10px 12px; }
  .search { grid-column: 1 / -1; position: relative; }
  .search input {
    width: 100%;
    padding: 10px 38px 10px 12px;
    border: 1px solid var(--line); border-radius: 10px;
    background: #f8f9fa; color: var(--text);
    font: inherit; font-size: 16px;
    -webkit-appearance: none; appearance: none;
  }
  .search input::-webkit-search-cancel-button { -webkit-appearance: none; }
  .search input:focus { outline: none; border-color: var(--theme); background: #fff; }
  .search .clear {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 32px; height: 32px;
    border: 0; background: none; color: var(--muted);
    font-size: 16px; cursor: pointer;
  }
  select {
    min-width: 0;
    padding: 8px 10px;
    border: 1px solid var(--line); border-radius: 8px;
    background: #fff; color: var(--text);
    font: inherit; font-size: 16px;
  }
  .toggle-zero { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .toggle-zero input { width: 18px; height: 18px; margin: 0; accent-color: var(--theme); }

  main { max-width: 760px; margin: 0 auto; padding: 10px 12px 60px; }
  .summary { margin: 2px 2px 10px; font-size: 13px; color: var(--muted); }
  .summary b { color: var(--text); font-size: 15px; }
  .summary .searching { margin-left: 6px; }

  .group-title {
    display: flex; justify-content: space-between; align-items: baseline;
    margin: 16px 4px 8px;
    font-size: 14px;
  }
  .group-title:first-child { margin-top: 4px; }
  .group-title span { font-size: 12px; font-weight: 400; color: var(--muted); }

  .item {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 8px; padding: 10px 12px;
    border-radius: 12px;
    background: var(--card);
    box-shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  .thumb {
    flex: 0 0 80px; width: 80px; height: 80px;
    border-radius: 10px;
    background: #eef0f2;
    object-fit: cover;
    cursor: pointer;
  }
  .thumb.none { display: flex; align-items: center; justify-content: center; font-size: 34px; cursor: default; }
  .info { flex: 1; min-width: 0; }
  .name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .chip { padding: 1px 8px; border-radius: 10px; background: #f0f2f4; font-size: 12px; }
  .chip.size { background: var(--text); color: #fff; font-weight: 700; }
  .pid { margin-top: 3px; font: 11px ui-monospace, Menlo, monospace; color: var(--muted); }
  .count { min-width: 52px; text-align: right; }
  .count b { display: block; font-size: 26px; line-height: 1; }
  .count small { font-size: 11px; color: var(--muted); }
  .count.zero b { color: var(--zero); }
  .count.low b { color: var(--low); }
  .count.ok b { color: var(--ok); }

  .empty { padding: 40px 16px; text-align: center; color: var(--muted); line-height: 1.8; }
  .link { border: 0; background: none; color: var(--theme); font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; }

  .modal {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    background: rgba(0,0,0,.7);
  }
  .modal-box { width: 100%; max-width: 420px; }
  .modal-box img { display: block; width: 100%; max-height: 70vh; object-fit: contain; border-radius: 10px; background: #fff; }
  .modal-title { margin-top: 10px; color: #fff; font-weight: 700; text-align: center; }

  .toast {
    position: fixed; left: 50%; bottom: 20px; z-index: 100;
    max-width: 90%;
    padding: 12px 18px;
    border-radius: 10px;
    background: #2c3e50; color: #fff;
    font-size: 14px;
    opacity: 0; transform: translate(-50%, 20px);
    transition: opacity .25s, transform .25s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.error { background: var(--zero); }
</style>
</head>
<body>

<div class="top">
  <header class="app-header">
    <div class="brand">
      <h1>コロッケ グッズ在庫</h1>
      <div class="sub">GOODS STOCK</div>
    </div>
    <span class="updated" id="updated"></span>
    <button type="button" class="reload" id="reload" aria-label="最新の在庫に更新">↻</button>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div class="controls">
    <div class="search">
      <input type="search" id="q" placeholder="🔍 カテゴリ・種別・色・サイズで検索" autocomplete="off" enterkeyhint="search">
      <button type="button" class="clear" id="qClear" aria-label="検索をクリア" hidden>✕</button>
    </div>
    <select id="sort" aria-label="並び替え">
      <option value="category">カテゴリ順</option>
      <option value="stockDesc">在庫の多い順</option>
      <option value="stockAsc">在庫の少ない順</option>
      <option value="size">サイズ順</option>
      <option value="id">商品ID順</option>
    </select>
    <label class="toggle-zero"><input type="checkbox" id="showZero">在庫0も表示</label>
  </div>
</div>

<main>
  <p class="summary" id="summary"></p>
  <div id="list"><div class="empty">読み込み中…</div></div>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <img id="modalImg" alt="" referrerpolicy="no-referrer">
    <div class="modal-title" id="modalTitle"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  // GASから開いたときは BOOT がここに埋め込まれる。
  // Googleサイト埋め込み版（tools/build-sites.js で BOOT=null・API_URL を設定）は起動時に取得する。
  let BOOT = null;
  const API_URL = 'https://script.google.com/macros/s/AKfycbzAASqPnaTyRfd7YgLiFCg685L4u_Sy7b6q1zudeJWNuC2RN6mYQy2gygsMDdG6mJE/exec';

  const POOL_COLORS = ['#e67e22', '#e84393', '#27ae60', '#3498db', '#8e44ad'];
  const SORTS = ['category', 'stockDesc', 'stockAsc', 'size', 'id'];
  const PREF_KEY = 'korokke.client';
  let owners = [];
  let sizes = [];
  let threshold = 5;

  const state = {
    products: [],
    pool: '',
    q: '',
    sort: 'category',
    showZero: false,
    loadedAt: Date.now(),
  };

  const $ = id => document.getElementById(id);

  const FETCH_TIMEOUT_MS = 10000;
  const CACHE_KEY = 'korokke.client.cache';

  function fetchJson(body, timeoutMs) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    return fetch(API_URL, { method: 'POST', body: JSON.stringify(body), credentials: 'omit', signal: ctrl.signal })
      .then(r => r.json())
      .finally(() => clearTimeout(timer));
  }

  /**
   * GAS内なら google.script.run、埋め込み版なら POST（Googleのログイン情報は送らない）。
   * GAS はまれに応答しないことがあるので、10秒で打ち切って最大3回までやり直す（読み取り専用なので安全）。
   */
  async function rpc(action, params) {
    if (!API_URL) {
      return new Promise((resolve, reject) => {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).api(action, params);
      });
    }
    const body = Object.assign({ action: action }, params);
    let lastError = null;
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        return await fetchJson(body, FETCH_TIMEOUT_MS);
      } catch (err) {
        lastError = err;
      }
    }
    throw new Error(lastError && lastError.name === 'AbortError' ? 'サーバーの応答がありません' : '通信に失敗しました');
  }

  /** 前回の在庫を端末に保存し、次に開いたときすぐ表示する */
  function saveCache(config, products) {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({ at: Date.now(), config: config, products: products }));
    } catch (e) { /* 保存できない環境 */ }
  }

  function loadCache() {
    try {
      const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      return cached && cached.config && Array.isArray(cached.products) ? cached : null;
    } catch (e) {
      return null;
    }
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function norm(s) {
    return String(s == null ? '' : s).normalize('NFKC').toLowerCase();
  }

  function cmp(a, b) {
    return a < b ? -1 : a > b ? 1 : 0;
  }

  function sizeRank(size) {
    const i = sizes.indexOf(size);
    return i < 0 ? sizes.length : i;
  }

  function countClass(n) {
    return n <= 0 ? 'zero' : n <= threshold ? 'low' : 'ok';
  }

  function poolColor(pool) {
    return POOL_COLORS[Math.max(0, owners.indexOf(pool)) % POOL_COLORS.length];
  }

  function imageSrc(url, width) {
    const m = /\/d\/([\w-]{20,})|[?&]id=([\w-]{20,})/.exec(url || '');
    const id = m ? m[1] || m[2] : '';
    return id ? 'https://lh3.googleusercontent.com/d/' + id + '=w' + width : url;
  }

  let toastTimer = null;
  function toast(message, isError) {
    const el = $('toast');
    el.textContent = message;
    el.className = 'toast show' + (isError ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = 'toast' + (isError ? ' error' : ''); }, isError ? 4500 : 2000);
  }

  // ---------- 表示設定の保存（区分・並び順・在庫0表示） ----------
  function loadPrefs() {
    try {
      const saved = JSON.parse(localStorage.getItem(PREF_KEY) || '{}');
      if (owners.indexOf(saved.pool) >= 0) state.pool = saved.pool;
      if (SORTS.indexOf(saved.sort) >= 0) state.sort = saved.sort;
      state.showZero = saved.showZero === true;
    } catch (e) { /* 保存できない環境 */ }
  }

  function savePrefs() {
    try {
      localStorage.setItem(PREF_KEY, JSON.stringify({ pool: state.pool, sort: state.sort, showZero: state.showZero }));
    } catch (e) { /* 保存できない環境 */ }
  }

  // ---------- 絞り込み・並び替え ----------
  function visibleItems() {
    const words = norm(state.q).split(/\s+/).filter(Boolean);
    return state.products
      .map(p => ({ p: p, n: p.stock[state.pool] || 0 }))
      .filter(x => state.showZero || x.n > 0)
      .filter(x => {
        const text = norm([x.p.id, x.p.category, x.p.type, x.p.color, x.p.size].join(' '));
        return words.every(w => text.indexOf(w) >= 0);
      });
  }

  function sortItems(items) {
    // カテゴリは商品IDの若い順（元の在庫表の並び）に並べる
    const rank = {};
    state.products.slice().sort((a, b) => cmp(a.id, b.id)).forEach(p => {
      if (!(p.category in rank)) rank[p.category] = Object.keys(rank).length;
    });
    const byProduct = (a, b) => (rank[a.p.category] - rank[b.p.category]) || cmp(a.p.type, b.p.type) ||
      cmp(a.p.color, b.p.color) || (sizeRank(a.p.size) - sizeRank(b.p.size));
    const sorters = {
      category: byProduct,
      stockDesc: (a, b) => (b.n - a.n) || byProduct(a, b),
      stockAsc: (a, b) => (a.n - b.n) || byProduct(a, b),
      size: (a, b) => (sizeRank(a.p.size) - sizeRank(b.p.size)) || byProduct(a, b),
      id: (a, b) => cmp(a.p.id, b.p.id),
    };
    return items.slice().sort(sorters[state.sort] || byProduct);
  }

  // ---------- 描画 ----------
  function renderTabs() {
    $('tabs').innerHTML = owners.map(o => {
      const total = state.products.reduce((sum, p) => sum + (p.stock[o] || 0), 0);
      return '<button type="button" class="tab' + (o === state.pool ? ' active' : '') + '" data-pool="' + esc(o) +
        '" style="--tab-color:' + poolColor(o) + '">' + esc(o) + '<small>' + total + '枚</small></button>';
    }).join('');
    document.documentElement.style.setProperty('--theme', poolColor(state.pool));
  }

  function itemHtml(x, grouped) {
    const p = x.p;
    const thumb = p.imageUrl
      ? '<img class="thumb" data-img="' + esc(p.id) + '" src="' + esc(imageSrc(p.imageUrl, 240)) + '" alt="" loading="lazy" referrerpolicy="no-referrer">'
      : '<div class="thumb none" aria-hidden="true">' + (/タオル/.test(p.type) ? '🧣' : '👕') + '</div>';
    // カテゴリ見出しの下では名前を種別にし、カテゴリの重複表示を避ける
    const chips = (grouped ? [] : [p.type]).concat([p.color])
      .map(c => '<span class="chip">' + esc(c) + '</span>').join('') +
      (p.size && p.size !== '-' ? '<span class="chip size">' + esc(p.size) + '</span>' : '');
    return '<div class="item">' + thumb +
      '<div class="info"><div class="name">' + esc(grouped ? p.type : p.category) + '</div>' +
      '<div class="chips">' + chips + '</div><div class="pid">' + esc(p.id) + '</div></div>' +
      '<div class="count ' + countClass(x.n) + '"><b>' + x.n + '</b><small>枚</small></div></div>';
  }

  function emptyHtml() {
    const message = state.q
      ? '「' + esc(state.q) + '」に一致する商品はありません'
      : esc(state.pool) + 'に在庫がある商品はありません';
    return '<div class="empty">' + message +
      (state.showZero ? '' : '<br><button type="button" class="link" data-action="show-zero">在庫0の商品も表示する</button>') +
      '</div>';
  }

  function render() {
    renderTabs();
    const items = sortItems(visibleItems());
    const total = items.reduce((sum, x) => sum + x.n, 0);
    $('summary').innerHTML = '<b>' + items.length + '</b>件 ／ 合計 <b>' + total + '</b>枚' +
      (state.q ? '<span class="searching">（「' + esc(state.q) + '」で絞り込み中）</span>' : '');

    if (!items.length) {
      $('list').innerHTML = emptyHtml();
      return;
    }
    if (state.sort !== 'category') {
      $('list').innerHTML = items.map(x => itemHtml(x, false)).join('');
      return;
    }
    const groups = [];
    items.forEach(x => {
      const last = groups[groups.length - 1];
      if (last && last.category === x.p.category) last.items.push(x);
      else groups.push({ category: x.p.category, items: [x] });
    });
    $('list').innerHTML = groups.map(g =>
      '<h2 class="group-title">' + esc(g.category) +
      '<span>' + g.items.length + '件・' + g.items.reduce((sum, x) => sum + x.n, 0) + '枚</span></h2>' +
      g.items.map(x => itemHtml(x, true)).join('')).join('');
  }

  function stampUpdated() {
    const d = new Date(state.loadedAt);
    $('updated').textContent = (d.getMonth() + 1) + '/' + d.getDate() + ' ' + d.getHours() + ':' +
      String(d.getMinutes()).padStart(2, '0') + ' 更新';
  }

  // ---------- 最新の在庫を取得 ----------
  function reload(silent) {
    const btn = $('reload');
    const done = () => { btn.disabled = false; btn.classList.remove('spin'); };
    btn.disabled = true;
    btn.classList.add('spin');
    rpc('getBootData', {})
      .then(res => {
        done();
        if (!res || !res.ok) return toast('最新の在庫を読み込めませんでした：' + (res ? res.error : '応答がありません'), true);
        applyConfig(res.data.config);
        state.products = res.data.products;
        state.loadedAt = Date.now();
        saveCache(res.data.config, res.data.products);
        stampUpdated();
        render();
        if (!silent) toast('最新の在庫を表示しています');
      })
      .catch(err => {
        done();
        toast('最新の在庫を読み込めませんでした（' + (err && err.message ? err.message : err) + '）。↻ で再読み込みしてください', true);
      });
  }

  function applyConfig(config) {
    BOOT.config = config;
    owners = config.owners;
    sizes = config.sizes;
    threshold = config.lowStockThreshold;
    if (owners.indexOf(state.pool) < 0) state.pool = owners[0];
  }

  // ---------- 初期化 ----------
  function init() {
    loadPrefs();
    $('sort').value = state.sort;
    $('showZero').checked = state.showZero;
    stampUpdated();
    render();

    $('tabs').addEventListener('click', e => {
      const tab = e.target.closest('[data-pool]');
      if (!tab) return;
      state.pool = tab.dataset.pool;
      savePrefs();
      render();
      window.scrollTo(0, 0);
    });
    $('q').addEventListener('input', e => {
      state.q = e.target.value;
      $('qClear').hidden = !state.q;
      render();
    });
    $('qClear').addEventListener('click', () => {
      $('q').value = '';
      state.q = '';
      $('qClear').hidden = true;
      render();
      $('q').focus();
    });
    $('sort').addEventListener('change', e => {
      state.sort = e.target.value;
      savePrefs();
      render();
    });
    $('showZero').addEventListener('change', e => {
      state.showZero = e.target.checked;
      savePrefs();
      render();
    });
    $('reload').addEventListener('click', () => reload(false));
    $('list').addEventListener('click', e => {
      if (e.target.closest('[data-action="show-zero"]')) {
        state.showZero = true;
        $('showZero').checked = true;
        savePrefs();
        render();
        return;
      }
      const img = e.target.closest('[data-img]');
      const p = img && state.products.find(x => x.id === img.dataset.img);
      if (!p) return;
      $('modalImg').src = imageSrc(p.imageUrl, 800);
      $('modalTitle').textContent = [p.category, p.type, p.color, p.size].join(' / ');
      $('modal').hidden = false;
    });
    $('modal').addEventListener('click', () => { $('modal').hidden = true; });
    // 開きっぱなしのページに戻ってきたら、5分以上たっていれば自動で最新にする
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && Date.now() - state.loadedAt > 5 * 60 * 1000) reload(true);
    });

    if (!BOOT.ok) toast('在庫の読み込みに失敗しました：' + BOOT.error, true);
  }

  function start(boot, loadedAt) {
    BOOT = boot;
    applyConfig(boot.config);
    state.pool = owners[0];
    state.products = boot.products || [];
    state.loadedAt = loadedAt || Date.now();
    init();
  }

  if (BOOT) {
    start(BOOT);
  } else {
    // 前回の在庫があればすぐ表示し、最新は裏で取り直す（GAS の応答待ちで止まって見えないように）
    const cached = loadCache();
    if (cached) {
      start(Object.assign({ ok: true }, cached), cached.at);
      reload(true);
    } else {
      rpc('getBootData', {})
        .then(res => {
          if (!res || !res.ok) throw new Error(res ? res.error : '応答がありません');
          saveCache(res.data.config, res.data.products);
          start(Object.assign({ ok: true }, res.data));
        })
        .catch(err => {
          $('list').innerHTML = '<div class="empty">在庫を読み込めませんでした（' + esc(err.message) + '）' +
            '<br><button type="button" class="link" onclick="location.reload()">もう一度読み込む</button></div>';
        });
    }
  }
</script>
</body>
</html>
